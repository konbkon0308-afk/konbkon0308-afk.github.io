<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>R sters pec 01</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=M+PLUS+1p:wght@800&display=swap" rel="stylesheet"> <!-- 追加: かっこいいフォント（Orbitron＋M PLUS 1p） -->
<style>
:root{--ink:#1d2230;--red:#e63946;--paper:#f7f0e2;--gold:#f59e0b;--blue:#2563eb;--purple:#9333ea;--carbon:#111827;--emerald:#10b981;--cyan:#0891b2}
html,body{margin:0;height:100%;overflow:hidden;background:#111827;font-family:"Orbitron","M PLUS 1p","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;user-select:none}
canvas{display:block}
.hud{position:fixed;text-align:right;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.7);pointer-events:none;display:none;z-index:40}
.tag{display:inline-block;padding:2px 14px;border-radius:4px;font-weight:900;font-size:15px;margin-bottom:4px;letter-spacing:.1em}
.help{position:fixed;color:#fff;background:rgba(17,24,39,.85);padding:8px 14px;border-radius:6px;font-size:12px;line-height:1.65;pointer-events:none;transition:opacity 1.5s;display:none;border:1px solid rgba(255,255,255,.2);z-index:40}
.help b{display:inline-block;min-width:74px;color:var(--gold)}
#divider{position:fixed;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6);display:none;z-index:50}
#cd{position:fixed;left:0;right:0;top:30%;text-align:center;color:#fff;font-size:120px;font-weight:900;font-style:italic;font-family:"Trebuchet MS",sans-serif;text-shadow:0 6px 0 var(--red),0 0 30px rgba(0,0,0,.7);pointer-events:none;z-index:60}
#esc{position:fixed;top:8px;left:0;right:0;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;z-index:60}

#ui{position:fixed;inset:0;pointer-events:none;z-index:200;display:flex;align-items:center;justify-content:center}
#panelSingle{pointer-events:auto;position:absolute;left:4vw;top:50%;transform:translateY(-50%);width:min(620px,94vw);max-height:92vh;overflow:auto;box-sizing:border-box;background:rgba(247,240,226,.98);color:var(--ink);border-left:9px solid var(--red);padding:22px 24px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#splitMenuWrap{display:none;width:100%;height:100%;pointer-events:none}
.split-panel{pointer-events:auto;position:absolute;top:3vh;bottom:3vh;width:46vw;overflow-y:auto;box-sizing:border-box;background:rgba(247,240,226,.97);color:var(--ink);padding:18px 20px;border-radius:8px;box-shadow:0 15px 45px rgba(0,0,0,.7)}
#panelP0{left:2vw;border-top:8px solid #2563eb}
#panelP1{right:2vw;border-top:8px solid #e63946}

.seal{display:inline-block;background:var(--red);color:#fff;font:900 32px "Hiragino Mincho ProN","Yu Mincho",serif;width:52px;height:52px;line-height:52px;text-align:center;border-radius:4px;transform:rotate(-3deg);vertical-align:middle;margin-right:10px}
h1{display:inline-block;vertical-align:middle;margin:0;font:900 22px "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.06em}
h2{margin:0 0 10px;font:900 18px "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.08em;color:var(--red);border-bottom:2px dashed rgba(230,57,70,.3);padding-bottom:6px}
h3{margin:12px 0 6px;font:900 14px sans-serif;color:var(--blue);border-left:4px solid var(--blue);padding-left:8px}
.sub{margin:8px 0 14px;font-size:12px;opacity:.85}
.btn{display:block;width:100%;margin:7px 0;padding:10px 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 14px inherit;font-family:inherit;letter-spacing:.08em;cursor:pointer;border-radius:4px;transition:.15s}
.btn:hover{background:var(--ink);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d2230;font-weight:900}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
.row{margin:9px 0 3px;font-weight:900;font-size:12px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 11px inherit;font-family:inherit;border-radius:16px;cursor:pointer;transition:.1s}
.chip.on{background:var(--ink);color:#fff}
.chip i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.card{background:rgba(29,34,48,.08);border-radius:6px;padding:9px 11px;font-size:12px;line-height:1.55;margin:7px 0;border-left:4px solid #2563eb}
.inp{display:block;width:100%;box-sizing:border-box;margin:5px 0;padding:8px;border:2px solid var(--ink);background:#fff;font:600 14px inherit;font-family:inherit;border-radius:4px}
.slider-group{margin:8px 0;background:rgba(0,0,0,.04);padding:10px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}
.slider-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px;margin-top:6px}
.slider-row:first-child{margin-top:0}
input[type=range]{width:100%;cursor:pointer;accent-color:var(--red)}
#touch{position:fixed;inset:0;pointer-events:none;display:none;touch-action:none;z-index:80}
.tb{position:absolute;pointer-events:auto;width:74px;height:74px;border-radius:50%;background:rgba(17,24,39,.6);border:3px solid rgba(255,255,255,.8);color:#fff;font:900 24px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
.tb.on{background:rgba(230,57,70,.85)}
.dist-badge{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.88);color:#fff;border:2px solid rgba(255,255,255,.8);padding:6px 18px;border-radius:20px;font:900 14px "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.12em;pointer-events:none;display:none;text-shadow:0 1px 3px #000;box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:55;white-space:nowrap}
#chaseHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:rgba(230,57,70,0.92);color:#fff;border:2px solid #fff;padding:8px 22px;border-radius:8px;font:900 16px sans-serif;letter-spacing:.08em;pointer-events:none;display:none;box-shadow:0 4px 20px rgba(0,0,0,.7);text-align:center;z-index:55}
#minimap{position:fixed;top:14px;right:14px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(17,24,39,.88);pointer-events:none;display:none;box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:55}

.prompt-box{position:fixed;bottom:130px;padding:10px 16px;border-radius:8px;font:900 13px sans-serif;letter-spacing:.05em;pointer-events:none;display:none;box-shadow:0 6px 22px rgba(0,0,0,.6);border:3px solid #fff;z-index:70;white-space:nowrap}
.p0-prompt{left:25%;transform:translateX(-50%)}
.p1-prompt{left:75%;transform:translateX(-50%)}
.single-prompt{left:50%;transform:translateX(-50%)}

.player-modal{position:fixed;top:0;bottom:0;background:rgba(10,12,18,.88);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:1000;pointer-events:auto}
.player-modal.full{left:0;right:0}
.player-modal.left-half{left:0;right:50%;border-right:3px solid #2563eb}
.player-modal.right-half{left:50%;right:0;border-left:3px solid #e63946}
.modal-box{width:94%;max-height:92vh;background:#f7f0e2;border-radius:8px;border:4px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.shop-header{background:#111827;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--gold)}
.shop-header h2{margin:0;color:var(--gold);font:900 17px "Hiragino Mincho ProN",serif}
.shop-body{padding:14px 18px;overflow-y:auto;max-height:68vh;flex:1}
.shop-footer{background:#e8dfcd;padding:10px 18px;text-align:right}
.currency-badge{background:rgba(245,158,11,0.2);color:#92400e;border:2px solid var(--gold);padding:4px 10px;border-radius:16px;font:900 12px monospace;display:inline-block;margin-bottom:6px}
.racing-hud{border:2px solid var(--red);background:rgba(17,24,39,.88);border-radius:8px;padding:8px 12px;box-shadow:0 0 15px rgba(230,57,70,.4)}
.spec-box{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
.spec-item{background:rgba(29,34,48,.08);padding:5px;border-radius:4px;text-align:center;border:1px solid rgba(0,0,0,.1)}
.spec-val{font:900 13px "Trebuchet MS",sans-serif;color:var(--red)}
.spec-lbl{font-size:10px;opacity:0.8}

#garageModal{position:fixed;inset:0;background:transparent;display:none;flex-direction:column;justify-content:space-between;z-index:1100;pointer-events:none}
#garageTopBar{pointer-events:auto;background:rgba(17,24,39,.88);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
#garageBottomDock{pointer-events:auto;background:rgba(247,240,226,.94);color:var(--ink);padding:14px 20px;max-height:38vh;overflow-y:auto;border-top:4px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.6)}
/* 追加: レース専用バナー・順位表・フリー表示 */
#raceBanner{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#e63946,#f59e0b);color:#fff;border:3px solid #fff;padding:7px 20px;border-radius:8px;font:900 16px sans-serif;letter-spacing:.14em;pointer-events:none;display:none;box-shadow:0 4px 20px rgba(0,0,0,.7);z-index:56;white-space:nowrap}
#rankBoard{position:fixed;top:100px;left:12px;background:rgba(17,24,39,.9);color:#fff;border:2px solid #f59e0b;border-radius:8px;padding:8px 10px;font:700 12px sans-serif;line-height:1.7;pointer-events:none;display:none;z-index:56;min-width:150px}
#rankBoard b{color:#f59e0b}
#rankBoard .me{color:#f59e0b;font-weight:900}
#freeBadge{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(16,185,129,.92);color:#fff;border:2px solid #fff;padding:6px 18px;border-radius:20px;font:900 13px sans-serif;letter-spacing:.12em;pointer-events:none;display:none;z-index:56;white-space:nowrap}
#raceGridInfo{position:fixed;top:96px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;border:2px solid #fff;border-radius:8px;padding:8px 14px;font:700 12px sans-serif;line-height:1.7;pointer-events:none;display:none;z-index:56;text-align:center}
/* 追加: ドリフト・バトル・スピード・実況・雨のHUD */
#driftHud{position:fixed;bottom:16px;left:12px;background:rgba(17,24,39,.9);color:#f59e0b;border:2px solid #f59e0b;border-radius:8px;padding:8px 12px;font:900 14px sans-serif;pointer-events:none;display:none;z-index:56}
#battleHud{position:fixed;top:140px;left:50%;transform:translateX(-50%);background:rgba(230,57,70,.94);color:#fff;border:3px solid #fff;border-radius:8px;padding:10px 18px;font:900 15px sans-serif;pointer-events:none;display:none;z-index:56;text-align:center}
#speedHud{position:fixed;bottom:16px;right:12px;background:rgba(17,24,39,.9);color:#fff;border:2px solid #38bdf8;border-radius:8px;padding:8px 12px;font:700 12px sans-serif;line-height:1.6;pointer-events:none;display:none;z-index:56;text-align:right}
#commentHud{position:fixed;top:200px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.88);color:#fff;border:2px solid #f59e0b;border-radius:20px;padding:8px 18px;font:900 14px sans-serif;pointer-events:none;display:none;z-index:56;white-space:nowrap}
#rainBadge{position:fixed;top:52px;right:12px;background:rgba(37,99,235,.92);color:#fff;border:2px solid #fff;padding:6px 14px;border-radius:20px;font:900 13px sans-serif;pointer-events:none;display:none;z-index:56}
/* 追加: ダメージ・ガソリン・ボス・リプレイのHUD */
#dmgHud{position:fixed;bottom:64px;left:12px;background:rgba(17,24,39,.9);color:#f87171;border:2px solid #f87171;border-radius:8px;padding:8px 12px;font:900 13px sans-serif;pointer-events:none;display:none;z-index:56}
#fuelHud{position:fixed;bottom:64px;right:12px;background:rgba(17,24,39,.9);color:#4ade80;border:2px solid #4ade80;border-radius:8px;padding:8px 12px;font:900 13px sans-serif;pointer-events:none;display:none;z-index:56}
#bossHud{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:rgba(147,51,234,.94);color:#fff;border:3px solid #fff;border-radius:8px;padding:8px 16px;font:900 14px sans-serif;pointer-events:none;display:none;z-index:56}
#replayExit{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;border:3px solid #fff;border-radius:8px;padding:10px 22px;font:900 15px sans-serif;cursor:pointer;display:none;z-index:70}
#sellPanel{margin-top:14px;background:rgba(29,34,48,.08);border:2px dashed rgba(230,57,70,.5);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.6}
#sellPanel .btn{margin:4px 0;padding:6px 10px;font-size:12px}
</style>
<style>
/* 追加: スマホでUIがデカすぎる問題の対策（画面幅760px以下で自動で小さくする） */
@media (max-width:760px){
#panelSingle{left:2vw;width:96vw;padding:12px 14px;max-height:96vh}
#splitMenuWrap .split-panel{width:48vw;padding:12px 10px}
.seal{width:40px;height:40px;line-height:40px;font-size:24px;margin-right:6px}
h1{font-size:17px}
h2{font-size:15px}
h3{font-size:12px}
.sub{font-size:11px;margin:6px 0 10px}
.btn{padding:8px 10px;font-size:13px;margin:5px 0}
.chip{padding:4px 7px;font-size:10px}
.card{font-size:11px;padding:7px 9px;line-height:1.5}
.inp{padding:6px;font-size:13px}
.slider-group{padding:6px}
.row{font-size:11px}
.modal-box{width:96%;max-height:96vh}
.shop-header{padding:8px 12px}
.shop-header h2{font-size:14px}
.shop-body{max-height:58vh;padding:10px 12px}
.shop-footer{padding:8px 12px}
.tb{width:60px;height:60px;font-size:20px;border-width:2px}
#cd{font-size:64px}
.hud{font-size:12px}
.tag{font-size:12px;padding:2px 8px}
.help{font-size:10px;padding:6px 8px}
#minimap{width:90px!important;height:90px!important;top:8px;right:8px}
#rankBoard{font-size:11px;max-width:94vw;top:52px;padding:6px 8px;line-height:1.5}
#raceBanner{font-size:13px;top:8px;padding:5px 12px}
#raceGridInfo{font-size:11px;top:80px;max-width:92vw;padding:6px 10px}
.prompt-box{bottom:100px;font-size:11px;padding:7px 10px;max-width:92vw;white-space:normal;text-align:center}
.dist-badge{font-size:11px;padding:4px 12px;top:8px}
#chaseHud{font-size:12px;top:44px;padding:6px 12px;max-width:92vw}
#driftHud,#speedHud,#dmgHud,#fuelHud{font-size:11px;padding:6px 8px}
#battleHud{font-size:12px;top:110px;padding:8px 12px;max-width:92vw}
#commentHud{font-size:12px;top:170px;white-space:normal;max-width:92vw;text-align:center}
#bossHud{font-size:12px;top:88px;max-width:92vw}
#sellPanel{font-size:11px}
#sellPanel .btn{font-size:11px}
}
/* 追加: 「UIを小さくする」切替ボタン用（タブレットなど画面が広くても小さくしたいとき） */
body.small-ui #panelSingle{left:2vw;width:96vw;padding:12px 14px}
body.small-ui .btn{padding:8px 10px;font-size:13px}
body.small-ui .chip{padding:4px 7px;font-size:10px}
body.small-ui h1{font-size:17px}
body.small-ui .modal-box{width:96%;max-height:96vh}
body.small-ui .shop-body{max-height:58vh;padding:10px 12px}
body.small-ui #rankBoard{font-size:11px}
body.small-ui #cd{font-size:64px}
/* 追加: UI表示・非表示設定（チェックを外したものは隠す） */
body.hide-minimap #minimap{display:none!important}
body.hide-rankBoard #rankBoard{display:none!important}
body.hide-raceBanner #raceBanner{display:none!important}
body.hide-raceGridInfo #raceGridInfo{display:none!important}
body.hide-driftHud #driftHud{display:none!important}
body.hide-speedHud #speedHud{display:none!important}
body.hide-dmgHud #dmgHud{display:none!important}
body.hide-fuelHud #fuelHud{display:none!important}
body.hide-commentHud #commentHud{display:none!important}
body.hide-bossHud #bossHud{display:none!important}
body.hide-battleHud #battleHud{display:none!important}
body.hide-rainBadge #rainBadge{display:none!important}
body.hide-distBadge #distBadge{display:none!important}
body.hide-help .help{display:none!important}
body.hide-touch #touch{display:none!important}
/* 追加: 2人プレイ縦画面でショップも上下に分ける */
body.split-v .player-modal.left-half{left:0;right:0;top:0;bottom:50%;border-right:none;border-bottom:3px solid #2563eb}
body.split-v .player-modal.right-half{left:0;right:0;top:50%;bottom:0;border-left:none;border-top:3px solid #e63946}
/* 追加: 2人プレイ用タッチボタン（2P分） */
#touch2{position:fixed;left:0;right:0;top:50%;bottom:0;pointer-events:none;display:none;touch-action:none;z-index:80}
body.two-touch #touch{bottom:50%!important}
body.two-touch #touch2{display:block}
/* 追加: コレクション図鑑パネル */
#collectionPanel{position:fixed;right:2vw;top:3vh;bottom:3vh;width:min(480px,92vw);overflow:auto;background:rgba(247,240,226,.98);color:#111827;border-left:9px solid #9333ea;padding:18px 20px;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:1200;display:none}
/* 追加: D1ドリフト用HUD */
#d1Hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;border:2px solid #f59e0b;border-radius:8px;padding:6px 14px;font-size:13px;line-height:1.5;text-align:center;z-index:60;display:none;pointer-events:none}
/* 追加: 手配度HUD */
#wantedHud{position:fixed;top:8px;right:8px;background:rgba(17,24,39,.85);color:#fbbf24;border:2px solid #e63946;border-radius:8px;padding:4px 10px;font-size:14px;z-index:60;display:none;pointer-events:none}
/* 追加: 徒歩中HUDと入店パネル */
#onFootHud{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;border:2px solid #f97316;border-radius:8px;padding:6px 12px;font-size:13px;z-index:60;display:none;text-align:center;pointer-events:none}
#shopEnterPanel{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);background:rgba(247,240,226,.97);color:#111827;border-left:9px solid #f59e0b;padding:12px 16px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:70;display:none;text-align:center;pointer-events:none}
#onFootHud .btn,#shopEnterPanel .btn{pointer-events:auto}
</style>
<style>
/* 追加: スマホの操作ボタンを大きくする（左右・アクセル・ブレーキを90pxに） */
@media (max-width:760px){
.tb[data-k="KeyA"],.tb[data-k="ArrowLeft"]{width:90px!important;height:90px!important;left:12px!important;bottom:24px!important;font-size:30px!important}
.tb[data-k="KeyD"],.tb[data-k="ArrowRight"]{width:90px!important;height:90px!important;left:114px!important;bottom:24px!important;font-size:30px!important}
.tb[data-k="KeyS"],.tb[data-k="ArrowDown"]{width:90px!important;height:90px!important;right:114px!important;bottom:24px!important;font-size:30px!important}
.tb[data-k="KeyW"],.tb[data-k="ArrowUp"]{width:90px!important;height:90px!important;right:12px!important;bottom:24px!important;font-size:30px!important}
.tb[data-k="Space"],.tb[data-k="ShiftRight"]{bottom:126px!important}
}
</style>
<style>
/* 追加: スタイリッシュUIテーマ（ダーク＋ゴールド・シャープな見た目に総入れ替え。マップと機能はそのまま） */
:root{--ink:#e9ebf2;--paper:#0d1017;--red:#d92338;--gold:#c9a24d;--blue:#2f6bff;--purple:#7c3aed;--carbon:#0a0c11;--emerald:#10b981;--cyan:#22a8c7}
html,body{background:#07080c}
#panelSingle{background:rgba(10,12,17,.97);color:var(--ink);border-left:3px solid var(--gold);border-radius:2px;box-shadow:0 24px 70px rgba(0,0,0,.75)}
.split-panel{background:rgba(10,12,17,.97);color:var(--ink);border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.75)}

function tire(vxa,vya,d,Fz,mu,Fx,st,isRear){
  const cd_=Math.cos(d),sd=Math.sin(d);
  const ul=vxa*cd_+vya*sd,ut=-vxa*sd+vya*cd_;

  const toeAngle  = isRear ? (st.toeR * 0.015) : (st.toeF * 0.015);
  const al = Math.atan2(ut, Math.max(Math.abs(ul),2.5)) * camberEff + toeAngle;
  const cap = mu * Fz;
  Fx = clamp(Fx, -cap, cap);
  const D = Math.max(0.2*cap, Math.sqrt(cap*cap - Fx*Fx));
  const Fy = -D * Math.sin(1.4 * Math.atan(10 * al));
  return {x:Fx*cd_-Fy*sd, y:Fx*sd+Fy*cd_, fy:Fy, al:al};
}

  const muF = gm * as.muF * pf.muF * swayF_eff * rideEff;

const toBody=(S,wx,wz)=>{S.u=wx*Math.sin(S.h)+wz*Math.cos(S.h);S.v=wx*Math.cos(S.h)-wz*Math.sin(S.h)};

  S.x-=nx*ex;S.z-=nz*ex;

  for(const pt of pts){
    const px=pt[0],pz=pt[1];
    let bi=pl.ti,best=1e9;
    for(let k=-6;k<=6;k++){
      const idx=(pl.ti+k+N)%N,tp=P[idx],d=(px-tp.x)**2+(pz-tp.z)**2;

function carHit(a,b){

function trafficStep(dt){

    let targetSpd = t.maxSpd * cornerBrake;
    if(t.hit>0){ t.hit-=dt; targetSpd *= 0.3; }
    TR.forEach((other, oIdx)=>{
      if(idx===oIdx || !other.on) return;
      const dist = Math.hypot(t.x - other.x, t.z - other.z);

    t.curSpd += (targetSpd - t.curSpd) * Math.min(1, t.accelBias * 3.0 * dt);

    t.x += Math.sin(t.h) * t.curSpd * dt * 0.55;

    policeCar.z += Math.cos(policeCar.h) * policeCar.curSpd * dt * 0.55;
    const curP = P[Math.floor(policeCar.s)%N];
    policeCar.g.position.set(policeCar.x, curP.y, policeCar.z);

    const dist=Math.hypot(pPl.S.x-policeCar.x, pPl.S.z-policeCar.z);
    document.getElementById('chaseHud').innerHTML=`🚨 パトカー猛追中！ 距離: <span>${Math.round(dist)}</span>m`;

    const cornerBrake = clamp(1.0 - P[(i+8)%N].curv * 1.1, 0.48, 1.0);

function companyStep(dt){ // 追加: 会社の販売を進める（30秒で1日）
  if(!SET.company)return; // 追加: 会社がなければ何もしない
  companyDayT+=dt; // 追加: 時間をためる
  if(companyDayT<30)return; // 追加: 30秒で1日
  companyDayT=0; // 追加: 次の日にする
  let anySold=false; // 追加: 売れたか
  SET.company.designs.forEach(d=>{ // 追加: 設計した車ごとに売る
    const cc=companyCost(d); // 追加: コスト
    const appeal=cc.body.appeal+cc.wing.appeal+Math.min(70,d.ps/10); // 追加: 人気（形＋ウィング＋馬力）
    const dCost=(typeof d.cost==='number'&&isFinite(d.cost))?d.cost:cc.cost;const dPrice=(typeof d.price==='number'&&isFinite(d.price))?d.price:dCost*1.3;const fair=dCost*1.3; // 追加: ちょうどいい値段（売値・コストが壊れていたら計算し直す）
    const ratio=dPrice/fair; // 追加: 値段の割高さ（1でちょうどいい）
    const demand=cc.body.market*(appeal/60)*Math.max(0.2,1.6-ratio)*(1+SET.company.rep/100)*(0.7+Math.random()*0.6); // 追加: 需要（人気・コスパ・評判で決まる）
    const units=Math.min(3,Math.max(0,Math.round(demand))); // 追加: 売れた台数（1日最大3台まで。お金が無限に増えるのを防ぐ）
    if(units>0){ // 追加: 売れたときだけ
      const profit=(dPrice-dCost)*units; // 追加: 利益（売値−製造コスト）×台数
      const tax=Math.floor(profit*0.2); // 追加: 法人税20%
      const net=profit-tax; // 追加: 税引き後の利益
      SET.money[0]+=net; // 追加: 税引き後の利益を所持金に入れる
      d.sold+=units; // 追加: 売れた台数を数える
      SET.company.totalSold+=units; // 追加: 会社の総販売台数
      SET.company.totalProfit+=net; // 追加: 会社の総利益（税引き後）
      SET.company.totalTax=(SET.company.totalTax||0)+tax; // 追加: 今までに納めた税金
      SET.company.rep=Math.min(100,SET.company.rep+units*0.2); // 追加: 評判が上がる
      companyLog.unshift({name:d.name,units:units,profit:net});if(companyLog.length>5)companyLog.pop(); // 追加: 販売記録（税引き後）
      showComment('🏭 '+d.name+'が'+units+'台売れた！ 利益 ¥'+net.toLocaleString()+'（法人税 ¥'+tax.toLocaleString()+'）'); // 追加: 売れたことを知らせる
      anySold=true; // 追加: 売れた
    } // 追加: 売れたときここまで
  }); // 追加: 車ごとここまで
  if(anySold){save();if(companyLevel()!==companyLevelShown)buildCompanyBuilding();} // 追加: 売れたら保存してレベルが上がったら建物を変える
} // 追加: 会社販売ここまで

function courseSceneryGroup(){ // 追加: コースの背景を作る
  const g=new THREE.Group();g.name='courseScenery'; // 追加: 背景のグループ
  let cx=0,cz=0;for(let i=0;i<N;i++){cx+=P[i].x;cz+=P[i].z;}cx/=N;cz/=N; // 追加: コースの中心
  const rnd=(a,b)=>a+Math.random()*(b-a); // 追加: 乱数
  const mtn=(x,z,h,r,col)=>{ // 追加: 山を作る
    const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),LM(col||0x4a6b4f));c.position.set(x,h/2-2,z);g.add(c); // 追加: 山の本体
    const cap=new THREE.Mesh(new THREE.ConeGeometry(r*0.35,h*0.3,8),LM(0xf8fafc));cap.position.set(x,h*0.85-2,z);g.add(cap); // 追加: 雪の頂上
  }; // 追加: 山ここまで
  const tree=(x,z,y,s2)=>{ // 追加: 木を作る
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,2,6),LM(0x7c4a21));tr.position.set(x,(y||0)+1,z);g.add(tr); // 追加: 幹
    const lv=new THREE.Mesh(new THREE.ConeGeometry(2.2*(s2||1),5*(s2||1),8),LM(0x166534));lv.position.set(x,(y||0)+4.5*(s2||1),z);g.add(lv); // 追加: 葉
  }; // 追加: 木ここまで
  const stand=(px,pz,h,side)=>{ // 追加: 観客席を作る
    const sg=new THREE.Group(); // 追加: 観客席のグループ
    const base=new THREE.Mesh(new THREE.BoxGeometry(24,1.5,10),LM(0x475569));base.position.y=0.75;sg.add(base); // 追加: 土台
    for(let t=0;t<3;t++){const tier=new THREE.Mesh(new THREE.BoxGeometry(24,1.2,2.6),LM(t===0?0x64748b:t===1?0x475569:0x334155));tier.position.set(0,2.1+t*1.2,2.2-t*2.6);sg.add(tier);} // 追加: 3段の座席
    const roof=new THREE.Mesh(new THREE.BoxGeometry(26,0.4,12),LM(0xdc2626));roof.position.set(0,6.2,-1);sg.add(roof); // 追加: 屋根
    [-11,11].forEach(ox=>{const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,5,6),LM(0x94a3b8));pole.position.set(ox,3.5,-5);sg.add(pole);}); // 追加: 屋根の柱
    const cols=[0xe63946,0x2563eb,0xf59e0b,0x10b981,0x9333ea,0xf4f4ef]; // 追加: 観客の色
    for(let i=0;i<24;i++){const sp=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7),LM(cols[i%cols.length]));sp.position.set(-11+(i%12)*2,3.1+Math.floor(i/12)*1.2,2.2-Math.floor(i/12)*2.6);sg.add(sp);} // 追加: 観客
    sg.position.set(px,0,pz);sg.rotation.y=h;g.add(sg); // 追加: 観客席を置く
  }; // 追加: 観客席ここまで
  const skyline=(x,z,n2)=>{ // 追加: 遠くのビルの群れを作る
    for(let i=0;i<n2;i++){const a=rnd(0,Math.PI*2),r=rnd(60,160);const bx=x+Math.cos(a)*r,bz=z+Math.sin(a)*r;const h=rnd(30,110);const b=new THREE.Mesh(new THREE.BoxGeometry(rnd(14,24),h,rnd(14,24)),new THREE.MeshLambertMaterial({map:buildingTexture([0x64748b,0x475569,0x3b4a5a,0x5b6b7a][i%4],i+3)}));b.position.set(bx,h/2,bz);g.add(b);} // 追加: ビル
  }; // 追加: 遠くのビルここまで
  const ct=RT.ctype; // 追加: コースの種類
  if(ct==='megacity'){ // 追加: 街のコースは遠くに山とビル
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2+rnd(-0.2,0.2);mtn(cx+Math.cos(a)*1250,cz+Math.sin(a)*1250,rnd(180,320),rnd(180,300));} // 追加: 遠くの山
    skyline(cx,cz,8); // 追加: 遠くのビル
  }else if(ct==='highway'){ // 追加: 高速は遠くに街と山
    skyline(cx+500,cz,14); // 追加: 湾岸の街
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2+rnd(-0.3,0.3);mtn(cx+Math.cos(a)*1150,cz+Math.sin(a)*1150,rnd(150,280),rnd(160,280));} // 追加: 遠くの山
    for(let i=0;i<N;i+=40){const p=P[i];tree(p.x+p.lx*22,p.z+p.lz*22,p.y,1);} // 追加: 道路沿いの木
  }else if(ct==='mtn'){ // 追加: 峠は山と森
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2+rnd(-0.2,0.2);mtn(cx+Math.cos(a)*rnd(750,1200),cz+Math.sin(a)*rnd(750,1200),rnd(200,380),rnd(200,340));} // 追加: 近くの山
    for(let i=0;i<N;i+=25){const p=P[i];const s2=(i%50===0)?-1:1;tree(p.x+p.lx*s2*20,p.z+p.lz*s2*20,p.y,rnd(0.8,1.5));} // 追加: 森
  }else{ // 追加: サーキットは観客席と木と山
    for(let i=0;i<6;i++){const idx=Math.floor(i*N/6)+30;const p=P[idx];const s2=(i%2===0)?1:-1;stand(p.x+p.lx*s2*30,p.z+p.lz*s2*30,p.h+(s2>0?Math.PI/2:-Math.PI/2),s2);} // 追加: 観客席6つ
    for(let i=0;i<N;i+=35){const p=P[i];tree(p.x+p.lx*24,p.z+p.lz*24,p.y,rnd(0.8,1.3));} // 追加: 木
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2+rnd(-0.3,0.3);mtn(cx+Math.cos(a)*1100,cz+Math.sin(a)*1100,rnd(160,300),rnd(180,300));} // 追加: 遠くの山
    if(ct==='fuji'){mtn(cx+900,cz-700,420,380,0x5b7a99);} // 追加: 富士山みたいな大きな山
  } // 追加: コースの種類ここまで
  scene.add(g); // 追加: 背景を出す
  return g; // 追加: 背景を返す
} // 追加: コースの背景ここまで

function ghostStep(pl,dt){ // 追加: ゴースト記録と再生（TAのみ）
  if(SET.mode!=='ta'||pl.k!==0)return; // 追加: TAの1Pだけ
  if(state!=='game')return; // 追加: ゲーム中だけ
  if(!ghostModel){ // 追加: ゴーストの車を一度だけ作る
    try{ghostModel=mkNpcModel(0,0x38bdf8);ghostModel.traverse(o=>{if(o.material){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=0.45;}});scene.add(ghostModel);ghostModel.visible=false;}catch(e){} // 追加: 半透明の車にする
  } // 追加: ゴースト作成ここまで
  if(pl.laps!==ghostLap){ // 追加: 周が変わったら
    if(ghostRec.length>10){ // 追加: 記録があれば
      const lapTime=pl.lt-ghostLapStartLt; // 追加: この周のタイム
      const best=pl.best||0; // 追加: 自己ベスト
      if(best===0||lapTime<best){ // 追加: ベスト更新なら
        try{localStorage.setItem('kt_ghost_v237_'+SET.route+'_p0',JSON.stringify(ghostRec));ghostData=ghostRec.slice();showComment('👻 ゴースト更新！ 自己ベストの走りを保存した！');}catch(e){} // 追加: ゴーストを保存
      } // 追加: ベスト判定ここまで
    } // 追加: 記録判定ここまで
    ghostRec=[];ghostLapStartLt=pl.lt;ghostLap=pl.laps; // 追加: 次の周の記録を始める
  } // 追加: 周切り替えここまで
  if(cd<=0&&!pl.finished){ // 追加: 走行中は記録する
    ghostRec.push([pl.S.x,pl.S.z,pl.S.h,pl.lt-ghostLapStartLt]); // 追加: 位置と周内時間を記録
    if(ghostRec.length>6000)ghostRec.shift(); // 追加: 記録が長すぎたら古いものを捨てる
  } // 追加: 記録ここまで
  if(!ghostData){ // 追加: 保存済みゴーストがなければ読む
    try{ghostData=JSON.parse(localStorage.getItem('kt_ghost_v237_'+SET.route+'_p0')||'null');}catch(e){ghostData=null;} // 追加: 保存データを読む
  } // 追加: 読み込みここまで
  if(ghostModel&&ghostData&&ghostData.length>10&&cd<=0){ // 追加: ゴーストがあれば再生する
    const t=pl.lt-ghostLapStartLt; // 追加: 今の周内時間
    let gi=0;while(gi<ghostData.length-1&&ghostData[gi+1][3]<t)gi++; // 追加: 時間に合う記録を探す
    const g=ghostData[gi];ghostModel.visible=true;ghostModel.position.set(g[0],pl.S.y,g[1]);ghostModel.rotation.y=g[2]; // 追加: ゴーストを置く
  }else if(ghostModel){ghostModel.visible=false;} // 追加: なければ隠す
} // 追加: ゴーストここまで

function aiRacingLine(dt){ // 追加: レースAIのレーシングライン（アウト・イン・アウトで最短ルートを取る）
  if(SET.mode!=='race'&&SET.mode!=='split_race'&&SET.mode!=='gt500'&&!RT.circuit)return; // 追加: レースだけライン取りする
  if(cd>0||raceFinishedAll)return; // 追加: カウントダウン中と終了後はしない
  TR.forEach((t,idx)=>{ // 追加: AI全車のラインを決める
    if(!t.on)return; // 追加: 走っていない車は飛ばす
    const i=Math.floor(t.s)%N; // 追加: 今のコース位置
    const turnA=wrap(P[(i+14)%N].h-P[i].h); // 追加: これから14点の曲がり（今まさに曲がっている分）
    const turnB=wrap(P[(i+38)%N].h-P[(i+14)%N].h); // 追加: その先24点の曲がり（次のコーナー）
    const turnC=wrap(P[i].h-P[(i-14+N)%N].h); // 追加: 直前14点の曲がり（抜けてきたコーナー）
    const halfW=clamp((P[i].lim||12)-3.5,3,8); // 追加: 道路の端までの幅（コース復帰の限界より内側に収める）
    let off; // 追加: 狙う横位置（+が左、-が右）
    if(Math.abs(turnA)>0.10){off=Math.sign(turnA)*halfW*0.85;} // 追加: コーナー中はインの頂点を深く突く（最短ルート）
    else if(Math.abs(turnB)>0.13){off=-Math.sign(turnB)*halfW*0.9;} // 追加: コーナー手前は一番アウトから入る
    else if(Math.abs(turnC)>0.10){off=-Math.sign(turnC)*halfW*0.85;} // 追加: 出口はアウトいっぱいまで開く
    else{off=(t.lineBias||0)*0.5;} // 追加: 直線はほぼ真ん中
    if(t.raceOff==null)t.raceOff=off; // 追加: なめらか用の今のライン位置
    t.raceOff+=(off-t.raceOff)*Math.min(1,3.2*dt); // 追加: ラインを素早く切り替える
    off=t.raceOff; // 追加: なめらかにしたラインを使う
    TR.forEach((other,oIdx)=>{ // 追加: 前の車と被らないよう避ける
      if(idx===oIdx||!other.on)return; // 追加: 自分以外で
      const dist=Math.hypot(t.x-other.x,t.z-other.z); // 追加: 他車との距離
      if(dist<12&&Math.abs(off-other.lane)<2.5){off=clamp(off+(off>0?-2.2:2.2),-halfW,halfW);} // 追加: 近い車とはラインをずらす
    }); // 追加: 回避ここまで
    t.targetLane=clamp(off,-halfW,halfW); // 追加: 狙うラインをセット
    t.lane+=(t.targetLane-t.lane)*Math.min(1,3.0*dt); // 追加: ラインへ素早く寄せる
    if(t.baseMaxSpd==null)t.baseMaxSpd=t.maxSpd; // 追加: 元の最高速を覚える
    let spdCap; // 追加: 最高速の上限
    if(Math.abs(turnA)>0.10){spdCap=t.baseMaxSpd+70;} // 追加: コーナーはライン取りで速く走れる（+30まで）
    else if(Math.abs(turnB)>0.13){spdCap=t.baseMaxSpd+20;} // 追加: 進入も少し速く
    else{spdCap=t.baseMaxSpd+6;} // 追加: 直線は今まで通り
    t.maxSpd=Math.min(t.baseMaxSpd*(Math.abs(turnA)>0.10?2.0:1.0),spdCap); // 追加: 最高速を決める
  }); // 追加: ライン決めここまで
} // 追加: レーシングラインここまで

function rebuildRacingLine(){ // 追加: 黄色ラインをアウトインアウトに作り直す
  try{ // 追加: 安全に作り直す
    if(typeof racingLineMesh==='undefined'||!racingLineMesh)return; // 追加: ラインがなければ何もしない
    const raw=[]; // 追加: なめらかにする前の横位置
    for(let i=0;i<N;i++){ // 追加: コース全点のラインを決める
      const turnNear=wrap(P[(i+10)%N].h-P[i].h); // 追加: 10点先の曲がり具合
      const turnFar=wrap(P[(i+35)%N].h-P[i].h); // 追加: 35点先の曲がり具合
      const turnPast=wrap(P[i].h-P[(i-15+N)%N].h); // 追加: さっきの曲がり具合
      let off=0; // 追加: 狙う横位置
      if(Math.abs(turnNear)>0.12)off=Math.sign(turnNear)*2.0; // 追加: 頂点はイン側
      else if(Math.abs(turnFar)>0.15)off=-Math.sign(turnFar)*7.5; // 追加: 手前はアウト側
      else if(Math.abs(turnPast)>0.12)off=-Math.sign(turnPast)*6.0; // 追加: 出口はアウト側
      const lim=Math.max(2,(P[i].lim||12)-2.5); // 追加: 道路内に収まる限界
      raw.push(clamp(off,-lim,lim)); // 追加: 道路内に丸める
    } // 追加: ライン決めここまで
    const sm=raw.slice(); // 追加: なめらかにしたライン
    for(let pass=0;pass<2;pass++){for(let i=0;i<N;i++){let s2=0;for(let k=-15;k<=15;k++)s2+=sm[(i+k+N)%N];sm[i]=s2/31;}} // 追加: 前後15点を平均してなめらかにする（2回）
    const pts=[]; // 追加: 3Dの点
    for(let i=0;i<=N;i++){const pp=P[i%N];const o=sm[i%N];pts.push(new THREE.Vector3(pp.x+pp.lx*o,pp.y+0.18,pp.z+pp.lz*o));} // 追加: 横にずらした点を並べる
    racingLineMesh.geometry.dispose();racingLineMesh.geometry=new THREE.BufferGeometry().setFromPoints(pts); // 追加: 黄色ラインを差し替える
  }catch(e){} // 追加: 失敗してもゲームは止めない
} // 追加: 黄色ライン作り直しここまで

  }; // 追加: ルーム参加ここまで

function syncTuneForCar(k){ // 追加: 車が変わったらチューニングを切り替える（1台1台別々にする）

  if(!isFirst&&SET.parts&&SET.parts[k]){SET.tuneByCar[prev]=Object.assign({},SET.parts[k]);} // 追加: 前の車のパーツを覚える

  if(score>=97)return 'X';if(score>=93)return 'SS';if(score>=88)return 'S';if(score>=78)return 'A';if(score>=68)return 'B';if(score>=58)return 'C';if(score>=48)return 'D';if(score>=38)return 'E';if(score>=28)return 'F';return 'G'; // 追加: ランクを決める（X・SS・S・A・B・C・D・E・F・Gの10段階）

function tuneBonus(){ // 追加: チューニングで上がるOVR
  const cfg=CFG[0]||{}; // 追加: 自分の車の設定
  return Math.min(3,cfg.engine||0)*3+Math.min(3,cfg.turbo||0)*2+Math.min(3,cfg.weight||0)*1; // 追加: エンジン+3・ターボ+2・軽量化+1（1段階ごと）
} // 追加: チューニングボーナスここまで
function tunedOvr(k,ci){ // 追加: チューニングとパーツ込みのOVR
  const cr=CARS[ci]||CARS[0]; // 追加: 車
  const c=CFG[k]||{}; // 追加: その人のチューニング設定
  const f=perfOf(c); // 追加: チューニングの効果
  const pt=(SET.parts&&SET.parts[k])||{}; // 追加: 専門パーツ
  const ps=cr.ps*f.pw*(1+0.08*(pt.ecu||0)+0.06*(pt.cooler||0)); // 追加: チューン込みの馬力（インタークーラーも）
  const wt=cr.kg*f.weightMul*(1-0.03*(pt.carbon||0)-0.02*(pt.battery||0)+0.01*(pt.cage||0)); // 追加: チューン込みの重量（バッテリーで軽く・ケージで少し重く）
  let ov=ovrOf({ps:ps,kg:wt}); // 追加: パワーウェイト比からOVR
  ov+=Math.round(((f.muF+f.muR)/2-1)*10); // 追加: タイヤのグリップ分
  ov+=(pt.brake||0)+(pt.nos||0)+(pt.lsd2||0)+(pt.fly||0)+(pt.susp||0)+(pt.clutch||0)+(pt.cooler||0)+(pt.cage||0)+(pt.battery||0); // 追加: ブレーキ・NOS・LSD・フライホイール・サス・クラッチ・インタークーラー・ケージ・バッテリー分
  return Math.max(30,Math.min(100,Math.round(ov*10)/10)); // 追加: 30〜100.0に収める（小数第1位まで）
} // 追加: チューン込みOVRここまで

function cityDriveY(x,z){ // 追加: 街で走るときの地面の高さ
  for(let i=0;i<cityRamps.length;i++){ // 追加: 坂道の上か調べる

    if(t<0||t>r.len)continue; // 追加: 坂道の範囲外
    const lat=(x-r.x0)*(-r.dz)+(z-r.z0)*r.dx; // 追加: 坂道の横の距離
    if(Math.abs(lat)>6)continue; // 追加: 坂道の幅の外
    return CITY_Y+(r.y0-CITY_Y)*(1-t/r.len); // 追加: 坂道の高さ（街の高さで終わる）
  } // 追加: 坂道ここまで
  return groundYAt(x,z); // 追加: 坂道でなければいつもの地面の高さ
} // 追加: 街の地面の高さここまで
function onCityRamp(x,z){ // 追加: 街への坂道の上か調べる

function cityPushOut(S){ // 追加: 建物にぶつからないように押し出す

function d1Step(dt){ // 追加: 毎フレーム、D1ドリフトを進める
  if(SET.mode!=='d1'){ // 追加: D1モードでなければ片付ける
    if(d1.active){d1.active=false;if(d1Rival)d1Rival.g.visible=false;d1HudEl.style.display='none';} // 追加: ライバルとHUDを隠す
    return; // 追加: ここまで
  } // 追加: D1以外ここまで
  if(state!=='game')return; // 追加: ゲーム中でなければ何もしない
  if(!d1.active){if(players[0].finished)return;d1Init();return;} // 追加: リトライなどでD1が始まっていたら準備する（終了後は準備しない）
  if(cd>0)return; // 追加: カウントダウン中は待つ
  TR.forEach(t=>{if(t.on){t.on=false;t.g.visible=false;}}); // 追加: D1では一般車を消し続ける
  const pl=players[0],S=pl.S; // 追加: 1Pの車
  d1.time+=dt; // 追加: 経過時間
  const slip=Math.max(S.slipR||0,S.slipF||0); // 追加: 横滑り具合
  const sp=Math.hypot(S.u,S.v)*3.6; // 追加: 時速
  if(slip>0.15&&sp>30){ // 追加: ドリフトしていたら
    d1.driftT+=dt;d1.idleT=0;d1.combo=Math.min(5,1+Math.floor(d1.driftT/3)); // 追加: コンボが上がる
    d1.score+=sp*slip*dt*2*d1.combo; // 追加: 角度×速度×コンボで加点
  }else{ // 追加: ドリフトしていなければ
    d1.idleT+=dt;if(d1.idleT>1){d1.driftT=0;d1.combo=1;} // 追加: 1秒止んだらコンボ切れ
  } // 追加: ドリフト加点ここまで
  const lim=P[pl.ti].lim||12; // 追加: 道路の幅
  if(Math.abs(pl.dd)>lim){d1.driftT=0;d1.combo=1;} // 追加: コースアウトしたらコンボ切れ
  D1_CLIPS.forEach(ci=>{ // 追加: クリッピングポイントの判定
    if(d1.clips[ci])return; // 追加: 済みなら飛ばす
    const dd=idxDiff(pl.ti,ci); // 追加: クリップまでの距離
    if(Math.abs(dd)<3){ // 追加: クリップを通り過ぎたら
      d1.clips[ci]=true; // 追加: 判定済みにする
      if(slip>0.15&&Math.abs(pl.dd)>lim-4){d1.score+=500;showComment('🎯 クリッピング！ +500');} // 追加: 端まで寄せてドリフトしていたら加点
    } // 追加: クリップ判定ここまで
  }); // 追加: クリップここまで
  if(d1Rival){ // 追加: ライバル車を動かす
    const r=d1Rival;r.t+=dt;r.smokeT-=dt; // 追加: ライバルの時間
    const ri=Math.floor(r.s); // 追加: ライバルのコース位置
    let ac=0;for(let k=2;k<=18;k++)ac=Math.max(ac,P[(ri+k)%N].curv||0); // 追加: 前のコーナー具合
    const tSpd=26*Math.max(0.45,1-ac*1.2); // 追加: コーナーで減速
    r.curSpd+=(tSpd-r.curSpd)*Math.min(1,2*dt); // 追加: 速度をなめらかに変える
    r.s=(r.s+r.curSpd*dt/1.8)%N; // 追加: コースを進む
    const turnNear=wrap(P[(ri+10)%N].h-P[ri].h); // 追加: 近くの曲がり具合
    const turnFar=wrap(P[(ri+35)%N].h-P[ri].h); // 追加: 遠くの曲がり具合
    let baseOff=0; // 追加: ライバルのライン
    if(Math.abs(turnNear)>0.12)baseOff=Math.sign(turnNear)*2.0; // 追加: 頂点はイン側
    else if(Math.abs(turnFar)>0.15)baseOff=-Math.sign(turnFar)*7.5; // 追加: 手前はアウト側
    const sway=Math.sin(r.t*1.5)*3.0*(ac>0.1?1:0.3); // 追加: ドリフトの揺れ
    const off=clamp(baseOff+sway,-8,8); // 追加: 横位置を決める
    const pp=P[Math.floor(r.s)%N]; // 追加: ライバルのコース点
    r.x=pp.x+pp.lx*off;r.z=pp.z+pp.lz*off;r.h=pp.h; // 追加: ライバルの位置と向き
    r.g.position.set(r.x,pp.y,r.z);r.g.rotation.y=r.h; // 追加: ライバル車を置く
    if(ac>0.12&&r.smokeT<=0){smoke(r.x,pp.y+0.5,r.z);r.smokeT=0.15;} // 追加: コーナーでタイヤスモーク
    d1.rivalScore+=(ac>0.12?9:3)*dt; // 追加: ライバルのスコア
    const dist=Math.hypot(S.x-r.x,S.z-r.z); // 追加: ライバルとの距離
    if(dist<12&&slip>0.15&&sp>30){d1.score+=8*dt;} // 追加: 近くでドリフトしたら接近ボーナス
    d1._near=dist<12; // 追加: 接近中かどうか
  } // 追加: ライバルここまで
  const remain=Math.max(0,150-d1.time); // 追加: 残り時間
  d1HudEl.innerHTML='🏁 D1ドリフト　残り'+Math.ceil(remain)+'秒<br>スコア <b>'+Math.floor(d1.score)+'</b>（コンボ×'+d1.combo+'）　ライバル '+Math.floor(d1.rivalScore)+(d1._near?'　🔥接近中！':''); // 追加: HUD表示
  if(pl.laps>=1||d1.time>=150){d1End();} // 追加: 1周か時間切れで終了
} // 追加: D1進行ここまで
function d1End(){ // 追加: D1ドリフトの結果
  if(!d1.active)return; // 追加: 二重に結果を出さない

  const my=Math.floor(d1.score),rv=Math.floor(d1.rivalScore); // 追加: 最終スコア
  const win=my>rv,draw=my===rv; // 追加: 勝敗

    +'<div class="card">あなたのスコア <b>'+my+'</b>　vs　ライバル <b>'+rv+'</b><br>賞金 +¥'+prize.toLocaleString()+'<br>自己ベスト '+d1.best+'点</div>'
    +'<div class="card">ドリフトの角度と速度で加点、クリッピングポイントで+500、ライバルに接近してドリフトするとボーナス！</div>';} // 追加: リザルト内容

    const addPed=(cx,cz,ax,az,range)=>{ // 追加: 通行人を1人置く

      for(let i=0;i<N;i++){const pp=P[i];if(pp.x<minX)minX=pp.x;if(pp.x>maxX)maxX=pp.x;if(pp.z<minZ)minZ=pp.z;if(pp.z>maxZ)maxZ=pp.z;} // 追加: コースの範囲

function pedStep(dt){ // 追加: 毎フレーム、通行人を動かす
  if(!peds.length)return; // 追加: 通行人がいなければ何もしない
  const pl=players&&players[0]?players[0]:null; // 追加: 1Pの車
  const px=pl?pl.S.x:1e9,pz=pl?pl.S.z:1e9; // 追加: 1Pの位置
  const sp=pl?Math.hypot(pl.S.u,pl.S.v)*3.6:0; // 追加: 1Pの時速
  if(wanted>0){wantedT+=dt;if(wantedT>20){wanted--;wantedT=0;updateWanted();}} // 追加: 20秒たつと手配度が1つ下がる
  peds.forEach(pd=>{ // 追加: 通行人ごとに動かす
    if(pd.state==='down'){ // 追加: 倒れている通行人
      pd.t+=dt; // 追加: 倒れている時間
      if(pd.t>3){ // 追加: 3秒たったら起き上がって別の場所へ
        pd.state='walk';pd.t=0;pd.off=(Math.random()*2-1)*pd.range*0.5;pd.g.rotation.x=0;pd.g.visible=true;pd.excl.visible=false; // 追加: 復活
      } // 追加: 復活ここまで
      return; // 追加: 倒れている間は動かない
    } // 追加: 倒れている通行人ここまで
    const dx=pd.g.position.x-px,dz=pd.g.position.z-pz; // 追加: 車との向き
    const dist=Math.hypot(dx,dz); // 追加: 車との距離
    if(dist<1.6&&sp>1){ // 追加: 車にぶつかったら
      pd.state='down';pd.t=0;pd.g.rotation.x=-Math.PI/2;pd.excl.visible=false; // 追加: 通行人が倒れる
      wanted=Math.min(5,wanted+1);wantedT=0;updateWanted(); // 追加: 手配度が上がる
      showComment('🚨 通行人にぶつかった！ 手配度★'+wanted); // 追加: 実況
      return; // 追加: ここまで
    } // 追加: 衝突ここまで
    if(dist<12&&sp>20&&pd.state!=='flee'){ // 追加: 車が近くを速く通ったら
      pd.state='flee';pd.t=0;pd.fx=dx/dist;pd.fz=dz/dist;pd.excl.visible=true; // 追加: 逃げ始める
    } // 追加: 逃げ始めここまで
    if(pd.state==='flee'){ // 追加: 逃げている通行人
      pd.t+=dt; // 追加: 逃げている時間
      pd.g.position.x+=pd.fx*4*dt;pd.g.position.z+=pd.fz*4*dt; // 追加: 車から離れる
      pd.phase+=dt*14;pd.legL.rotation.x=Math.sin(pd.phase)*0.7;pd.legR.rotation.x=-Math.sin(pd.phase)*0.7; // 追加: 走る足の動き
      pd.g.rotation.y=Math.atan2(pd.fx,pd.fz); // 追加: 逃げる向きを向く
      if(pd.t>2){pd.state='walk';pd.excl.visible=false;pd.off=0;} // 追加: 2秒逃げたら歩きに戻る
      return; // 追加: 逃げている間は歩かない
    } // 追加: 逃げここまで
    if(pd.spdMul===undefined){pd.spdMul=0.55+Math.random()*0.95;if(Math.random()<0.3){pd.state='idle';pd.t=1+Math.random()*4;}} // 追加: 人によって速さが違い、立ち止まっている人もいる
    if(pd.state==='idle'){ // 追加: 立ち止まっている（スマホを見たり景色を見たり）
      pd.t-=dt;pd.legL.rotation.x*=0.75;pd.legR.rotation.x*=0.75; // 追加: 足を止める
      if(pd.t<=0){pd.state='walk';pickPedTarget(pd);} // 追加: また歩き出す
    }else{ // 追加: 歩いている
      if(pd.tx===undefined)pickPedTarget(pd); // 追加: 行き先がなければ決める
      const dx=pd.tx-pd.g.position.x,dz=pd.tz-pd.g.position.z;const dist=Math.hypot(dx,dz); // 追加: 行き先までの距離
      if(dist<0.5){ // 追加: 着いたら
        if(Math.random()<0.5){pd.state='idle';pd.t=0.8+Math.random()*4.5;} // 追加: 半分くらいの確率でしばらく立ち止まる
        else pickPedTarget(pd); // 追加: そのまま次の場所へ
      }else{ // 追加: 歩く
        const sp3=pd.speed*pd.spdMul; // 追加: その人の歩く速さ
        const vx=dx/dist,vz=dz/dist; // 追加: 行き先への向き
        pd.g.position.x+=vx*sp3*dt;pd.g.position.z+=vz*sp3*dt; // 追加: 進む
        pd.g.position.y=groundYAt(pd.g.position.x,pd.g.position.z); // 追加: 地面の高さに合わせる
        const want2=Math.atan2(vx,vz);pd.g.rotation.y+=wrap(want2-pd.g.rotation.y)*Math.min(1,7*dt); // 追加: なめらかに向きを変える
        pd.phase+=dt*(4.5+sp3*4);pd.legL.rotation.x=Math.sin(pd.phase)*0.5;pd.legR.rotation.x=-Math.sin(pd.phase)*0.5; // 追加: 足の動き（速さに合わせる）
      } // 追加: 歩くここまで
    } // 追加: 歩行・静止ここまで
  }); // 追加: 通行人ここまで
} // 追加: 通行人進行ここまで

let afterfireBuf=null; // 追加: アフターファイヤの音の素材
let afterfireCount=0; // 追加: アフターファイヤが鳴った回数

function afterfire(pl){ // 追加: アフターファイヤの音を鳴らす
  if(!AC||AC.state==='suspended')return; // 追加: 音が出せなければ何もしない
  try{ // 追加: 安全に鳴らす
    if(!afterfireBuf){const len=Math.floor(AC.sampleRate*0.2);afterfireBuf=AC.createBuffer(1,len,AC.sampleRate);const d=afterfireBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);} // 追加: ノイズの音を作る
    const out=MG||AC.destination; // 追加: 音の出口
    const pops=Math.random()<0.4?2:1; // 追加: たまに2連発
    for(let i=0;i<pops;i++){ // 追加: パンッと鳴らす
      const t=AC.currentTime+i*0.09; // 追加: 鳴らす時間
      const src=AC.createBufferSource();src.buffer=afterfireBuf; // 追加: ノイズの音源
      const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900; // 追加: 低い音だけ通す
      const gn=AC.createGain();gn.gain.setValueAtTime(0.6,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.14); // 追加: すぐ消える音量
      src.connect(fl);fl.connect(gn);gn.connect(out);src.start(t); // 追加: 音を出す
      const osc=AC.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(90,t);osc.frequency.exponentialRampToValueAtTime(40,t+0.1); // 追加: 低いドンッという音
      const og=AC.createGain();og.gain.setValueAtTime(0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.12); // 追加: すぐ消える音量
      osc.connect(og);og.connect(out);osc.start(t);osc.stop(t+0.13); // 追加: 音を出す
    } // 追加: アフターファイヤここまで
    afterfireCount++; // 追加: 鳴った回数を数える
    const fl2=pl.model&&pl.model.body?pl.model.body.children.find(ch=>ch.userData&&ch.userData.isFlame):null; // 追加: 炎を探す
    if(fl2){fl2.visible=true;pl.flameT=0.15;} // 追加: 炎を出す
  }catch(e){} // 追加: 失敗してもゲームは止めない
} // 追加: アフターファイヤここまで
function afterfireStep(dt){ // 追加: 毎フレーム、ギアが下がったか見る
  players.forEach((pl,k)=>{ // 追加: プレイヤーごとに見る
    const S=pl.S; // 追加: 車の状態
    if(S.gear<prevGear[k]&&S.rpm>2500){afterfire(pl);} // 追加: ギアが下がったらアフターファイヤ
    prevGear[k]=S.gear; // 追加: 今のギアを覚える
    if(pl.flameT>0){ // 追加: 炎が出ている間
      pl.flameT-=dt; // 追加: 炎の時間

function onFootStep(dt){ // 追加: 毎フレーム、徒歩を進める
  const eDown=!!K['KeyE']; // 追加: Eキーが押されているか
  const cDown=!!K['KeyC']; // 追加: Cキーが押されているか
  if(cDown&&!prevC&&onFoot)cycleWalkCam(); // 追加: Cを押した瞬間に視点を切り替える
  prevC=cDown; // 追加: Cキーを覚える
  if(eDown&&!prevE)toggleOnFoot(); // 追加: Eを押した瞬間に切り替える
  prevE=eDown; // 追加: Eキーを覚える
  if(!onFoot)return; // 追加: 徒歩でなければ何もしない
  if(state!=='game'){exitOnFoot();return;} // 追加: ゲーム中でなければやめる
  if(cd>0){exitOnFoot();return;} // 追加: カウントダウンが始まったらやめる
  const pl=onFootPl(),S=pl.S; // 追加: 自分の車
  S.x=parkedPos.x;S.z=parkedPos.z;S.u=0;S.v=0;S.thr=0;S.brk=0;S.hand=0; // 追加: 車を停めたままにする
  const fwd=(K['KeyW']||K['ArrowUp']?1:0)-(K['KeyS']||K['ArrowDown']?1:0); // 追加: 前後の入力
  const turn=(K['KeyD']||K['ArrowRight']?1:0)-(K['KeyA']||K['ArrowLeft']?1:0); // 追加: 左右の入力
  walkHeading-=turn*2.2*dt; // 追加: 向きを変える（右を押したら右を向くよう逆転を修正）
  const sprint=(K['ShiftLeft']||K['ShiftRight']||K['Space'])?8:4; // 追加: ダッシュは速い（スマホはDRIFTボタン）
  const mv=fwd*sprint*dt; // 追加: 歩く距離
  const ch=walkChar.g; // 追加: 歩く人
  ch.position.x=clamp(ch.position.x+Math.sin(walkHeading)*mv,-1500,1500); // 追加: 歩く（前後）
  ch.position.z=clamp(ch.position.z+Math.cos(walkHeading)*mv,-1500,1500); // 追加: 歩く（左右）
  ch.position.y=groundYAt(ch.position.x,ch.position.z); // 追加: 地面の高さに合わせる（道路の下に行かない）
  ch.rotation.y=walkHeading; // 追加: 歩く向きを向く
  if(fwd!==0||turn!==0){walkPhase+=dt*sprint*2;walkChar.legL.rotation.x=Math.sin(walkPhase)*0.6;walkChar.legR.rotation.x=-Math.sin(walkPhase)*0.6;} // 追加: 歩く足の動き
  else{walkChar.legL.rotation.x*=0.8;walkChar.legR.rotation.x*=0.8;} // 追加: 止まったら足を戻す
  const dd=Math.hypot(ch.position.x-tuneDoor.x,ch.position.z-tuneDoor.z); // 追加: 入り口との距離
  const modalOpen=pModalState[0].open||garageModalOpen; // 追加: ショップやガレージが開いているか
  shopEnterEl.style.display=(dd<3.5&&!modalOpen)?'block':'none'; // 追加: 入り口の近くで入店パネルを出す
} // 追加: 徒歩進行ここまで
function onFootCam(dt){ // 追加: 毎フレーム、徒歩中のカメラを動かす
  if(!onFoot||state!=='game')return; // 追加: 徒歩でなければ何もしない
  const ch=walkChar.g.position; // 追加: 歩く人の位置
  const fx=Math.sin(walkHeading),fz=Math.cos(walkHeading); // 追加: 歩く向き

  walkCamLook.x+=(lx-walkCamLook.x)*k;walkCamLook.y+=(ly-walkCamLook.y)*k;walkCamLook.z+=(lz-walkCamLook.z)*k; // 追加: 見る場所をなめらかに移す

function groundYAt(x,z){ // 追加: その場所の地面の高さ（コースの上ならコースの高さ、街なら道路の高さ）
  let best=1e18,by=0,blim=10; // 追加: 一番近いコースの点を探す
  for(let i=0;i<N;i++){const q=P[i];const dx=q.x-x,dz=q.z-z;const d=dx*dx+dz*dz;if(d<best){best=d;by=q.y;blim=q.lim||10;}} // 追加: 一番近いコースの点

function aiCourseFix(dt){ // 追加: AIのコースアウト修正
  const fixOne=(t)=>{ // 追加: 1台分のコース復帰
    if(!t||t.on===false||t.meet)return; // 追加: 出走していないAIと集会中の車は対象外（集会の車をコースに戻さない）
    const raceMode=(SET.mode==='race'||SET.mode==='split_race'||SET.mode==='gt500'); // 追加: レース中かどうか
    const s0=Math.floor(t.s)%N; // 追加: 現在の進行位置
    let bi=s0,best=1e18; // 追加: 一番近いコース点
    for(let k=-120;k<=120;k++){const i=(s0+k+N)%N;const p=P[i];const d=(t.x-p.x)*(t.x-p.x)+(t.z-p.z)*(t.z-p.z);if(d<best){best=d;bi=i;}} // 追加: 進行位置の前後120点から最近点を探す
    if(best>625){ // 追加: 25以上離れていたら進行位置が大きくズレている
      const sh=Math.sin(t.h),ch=Math.cos(t.h);let gb=bi,gbest=1e18; // 追加: 全コースから向きの合う最近点を探し直す
      for(let i=0;i<N;i++){const p=P[i];if(p.tx*sh+p.tz*ch<0.3)continue;const d=(t.x-p.x)*(t.x-p.x)+(t.z-p.z)*(t.z-p.z);if(d<gbest){gbest=d;gb=i;}} // 追加: 進行方向と合う点だけ候補にする
      if(gbest<best){best=gbest;bi=gb;} // 追加: 全体探索の方が近ければそちらを使う
    } // 追加: ズレが大きい場合の探し直しここまで
    const p=P[bi]; // 追加: 最近点のコース情報
    t.s=bi; // 追加: 進行位置を実際の位置に合わせ直す
    const dd=(t.x-p.x)*p.lx+(t.z-p.z)*p.lz; // 追加: コース中心からの横ズレ
    const maxLat=Math.min(10.0,Math.max(2.0,(p.lim||12)-2.0)); // 追加: 道路内に収まる横ズレの限界
    if(Math.abs(dd)>maxLat+0.75){ // 追加: 道路からはみ出していたら（少しの行き過ぎは許容して、引っかかり続けないようにする）
      const cl=(dd>0?1:-1)*(maxLat-0.5); // 追加: 限界より少し内側に戻す
      t.x=p.x+p.lx*cl;t.z=p.z+p.lz*cl; // 追加: 位置を道路内に戻す
      if('lane' in t)t.lane=cl*0.55; // 追加: レーンは内側に戻す（壁際のままだと張り付いてしまうため）
      t.h=wrap(t.h+wrap(p.h-t.h)*0.6); // 追加: 向きをコース方向に寄せる
      t.curSpd*=(raceMode?0.85:0.65); // 追加: 復帰時は減速する（レース中は軽め）
    } // 追加: はみ出し修正ここまで
    let aheadCurv=0; // 追加: 先のカーブを調べる
    for(let k=2;k<=18;k++)aheadCurv=Math.max(aheadCurv,P[(bi+k)%N].curv); // 追加: 先18点の最大カーブ
    const safeSpd=(t.maxSpd||44)*(raceMode?Math.max(0.78,1.0-aheadCurv*0.6):Math.max(0.30,1.0-aheadCurv*1.6)); // 追加: レース中はライン取り前提でコーナー速度の制限を大きく緩める
    if(t.curSpd>safeSpd)t.curSpd=safeSpd; // 追加: カーブ手前で速度を抑える
  }; // 追加: 1台分の修正ここまで
  TR.forEach(fixOne); // 追加: AI全車に適用
  if(chaseActive&&policeCar)fixOne(policeCar); // 追加: パトカーにも適用
  if(chaseActive&&fugitiveCar)fixOne(fugitiveCar); // 追加: 逃走車にも適用
} // 追加: AIコース復帰ここまで
function npcHit(pl,t){

    let dx=ax-bx,dz=az-bz;const d=Math.hypot(dx,dz);
    if(d<2&&d>0.001){
      dx/=d;dz/=d;S.x+=dx*(2-d);S.z+=dz*(2-d);
      const w=worldV(S),vr=w[0]*dx+w[1]*dz;
      if(vr<0){toBody(S,(w[0]-1.4*vr*dx)*0.9,(w[1]-1.4*vr*dz)*0.9);S.r*=0.7;t.hit=0.8;}
    }
  }
}

function audioUpdate(pl,on){
  const s=pl.snd;if(!AC||!s)return;
  const S=pl.S,c=pl.m.c,cf=CFG[pl.k],t=AC.currentTime;
  const ms=[[1400,1,0.9],[2600,1.6,1.1],[6000,2.6,1.3],[8200,3.6,1.5]][cf.muff]||[1400,1,0.9];
  if(s.mf!==cf.muff){s.ws.curve=curve(ms[1]);s.mf=cf.muff;}
  const f=Math.max(10,S.rpm/60*c.cyl/2);
  s.o[0].frequency.setTargetAtTime(f,t,0.03);s.o[1].frequency.setTargetAtTime(f*2,t,0.03);
  s.o[2].frequency.setTargetAtTime(c.rot?f*3.01:f*0.5,t,0.03);
  s.lp.frequency.setTargetAtTime(ms[0]*(0.5+S.thr*0.9+S.rpm/pl.m.red*0.4),t,0.05);
  s.out.gain.setTargetAtTime(on?(0.1+0.28*S.thr)*ms[2]*(c.rot?0.9:1):0,t,0.05);
  s.twg.gain.setTargetAtTime(on&&cf.engine===2?S.thr*0.02*(S.rpm/pl.m.red):0,t,0.08);
  s.tw.frequency.setTargetAtTime(1500+S.rpm*0.6,t,0.08);
  const sp=Math.hypot(S.u,S.v),sl=Math.max(S.slipR-0.12,0);
  s.ng.gain.setTargetAtTime(on&&sp>6?Math.min(0.1,sl*0.6):0,t,0.04);
  s.bp.frequency.setTargetAtTime(1200+sp*20,t,0.1);
}

function visuals(pl,p,dt,game){
  const S=pl.S,m=pl.model,sp=Math.hypot(S.u,S.v);
  const fT=Math.sin(S.h)*p.tx+Math.cos(S.h)*p.tz;
  S.pitch+=(-Math.atan(p.sl)*fT-clamp(S.ax*0.004,-0.05,0.05)-S.pitch)*(1-Math.exp(-10*dt));
  S.roll+=(clamp(S.ay*0.006,-0.08,0.08)-S.roll)*(1-Math.exp(-8*dt));
  m.car.position.set(S.x,S.y,S.z);m.car.rotation.set(S.pitch,S.h,0);
  m.body.rotation.z=S.roll;m.fw.forEach(w=>w.rotation.y=S.steer*0.4);
  m.shadow.position.set(S.x,S.y+0.01,S.z);m.shadow.rotation.y=S.h;
  pl.plate.position.set(S.x,S.y+3.4,S.z);
  m.car.updateMatrixWorld(true);
  if(!game)return;
  if((S.slipR>0.15||S.slipF>0.22)&&sp>6){
    pl.skidT-=dt;
    m.rw.forEach(w=>{
      tmp.set(w.position.x,0,w.position.z);m.body.localToWorld(tmp);
      if(Math.random()<0.6)smoke(tmp.x,tmp.y+0.3,tmp.z);
      if(pl.skidT<=0){const k=skids[si++%skids.length];k.position.set(tmp.x,tmp.y+0.05,tmp.z);k.rotation.y=S.h-Math.atan2(S.v,Math.max(S.u,1));k.visible=true;}
    });
    if(pl.skidT<=0)pl.skidT=0.04;
  }
  const w=worldV(S),va=Math.atan2(w[0],w[1]);
  const target=(sp>8&&S.u>0)?S.h+wrap(va-S.h)*0.45:S.h;
  pl.camH+=wrap(target-pl.camH)*(1-Math.exp(-5*dt));
  const c=pl.cam;
  if(pl.camMode===0){
    const back=9+sp*0.04;
    c.position.x+=(S.x-Math.sin(pl.camH)*back-c.position.x)*(1-Math.exp(-14*dt));
    c.position.z+=(S.z-Math.cos(pl.camH)*back-c.position.z)*(1-Math.exp(-10*dt));
    c.position.y+=(S.y+4.2+sp*0.012-c.position.y)*(1-Math.exp(-10*dt));
    c.lookAt(S.x+Math.sin(pl.camH)*4,S.y+1.4,S.z+Math.cos(pl.camH)*4);
  }else if(pl.camMode===1){
    c.position.set(S.x+Math.sin(S.h)*1.5, S.y+1.1, S.z+Math.cos(S.h)*1.5);
    c.lookAt(S.x+Math.sin(S.h)*15, S.y+1.0, S.z+Math.cos(S.h)*15);
  }else{
    c.position.set(S.x, S.y+1.28, S.z);
    c.lookAt(S.x+Math.sin(S.h)*20, S.y+1.2, S.z+Math.cos(S.h)*20);
  }
  c.fov+=(60+Math.min(1,sp/40)*12-c.fov)*(1-Math.exp(-6*dt));
  gauge(pl);
  const isRace = SET.mode==='ta' || SET.mode==='race' || SET.mode==='split_race' || SET.mode==='gt500' || RT.circuit;
  if(isRace){
    const dispLap = Math.min(2, pl.laps + 1);
    pl.lapEl.innerHTML=`LAP ${dispLap}/2　順位: ${pl.pos}位<br>${fmt(pl.lt)} (BEST ${fmt(pl.best)})`;
  }
  else if(SET.mode==='chase' || SET.mode==='police')pl.lapEl.innerHTML=`残り時間: ${Math.ceil(chaseTime)}秒`;
  else pl.lapEl.innerHTML=`${pl.m.ps|0}ps / ${pl.m.c.cc}cc`;
}

function taStep(pl,dt){
  if(cd>0||pl.finished)return;
  pl.lt+=dt;pl.totalTime+=dt;
  const d=idxDiff(pl.ti,CPL[pl.cp]);
  if(d>=0&&d<40){
    pl.cp++;
    if(pl.cp>=CPL.length){
      pl.cp=0;pl.laps++;pl.last=pl.lt;
      if(pl.laps>=2&&!pl.finished){
        pl.finished=true;
        const activePlayers = players.slice(0, SET.np);
        if(activePlayers.every(p=>p.finished)){
          const ranked = [...activePlayers].sort((a,b)=>a.totalTime-b.totalTime);
          ranked.forEach((p,idx)=>p.pos=idx+1);
          showRaceResult();
        }
      }
    }
  }
}
function showRaceResult(){

function applyNetData(data){
  const op=players[SET.host?1:0];
  if(data.mapSwitch){ // 追加: 相手がマップ・モードを変えたら自分も切り替える
    netSwitchApply(data.mapSwitch.route,data.mapSwitch.mode); // 追加: 同じマップ・モードで読み直す
    return; // 追加: ここまで
  } // 追加: マップ切替ここまで
  if(data.modeSwitch){ // 追加: 相手がモードだけ変えたら
    SET.mode=data.modeSwitch.mode;save(); // 追加: モードを合わせる
    startGame(); // 追加: 新しいモードで始める
    return; // 追加: ここまで
  } // 追加: モード切替ここまで
  if(data.S)Object.assign(op.S,data.S);
  if(data.lap!==undefined)op.laps=data.lap;
  if(data.cp!==undefined)op.cp=data.cp;
  if(data.chat&&data.chat.text)chatAddMsg(data.chat.name||'相手',data.chat.text,false); // 追加: 相手のチャットを受け取って表示する
  if(data.photo)addPhoto(data.photo,true); // 追加: 友達の写真を受け取って掲示板に貼る
}

function netAutoRejoin(){ // 追加: リロード後にオンラインの部屋へ自動で戻る
  let flag=false;try{flag=sessionStorage.getItem('kt_net_rejoin')==='1';}catch(e){} // 追加: 切り替えでのリロードか
  if(!flag||!SET.netMode||!SET.roomCode)return; // 追加: 切り替えでなければ何もしない
  try{sessionStorage.removeItem('kt_net_rejoin');}catch(e){} // 追加: 印を消す
  netSetStatus('ステータス: 部屋 '+SET.roomCode+' に戻っています…'); // 追加: 状態を表示

      if(hTries>6){netSetStatus('ステータス: 部屋に戻れませんでした');netLeaveRoom(false);showComment('🔌 部屋に戻れなかったから1人プレイに戻したよ');return;} // 追加: 6回だめなら1人プレイに戻す（落ちたままにしない）

      peer.on('connection',c=>{ // 追加: 相手が来たら

        conn.on('data',d=>applyNetData(d)); // 追加: 相手のデータを受け取る
      }); // 追加: 参加待ちここまで
      peer.on('error',()=>{if(!opened)setTimeout(tryHost,2000);}); // 追加: 部屋が開ける前に失敗したら2秒後に作り直す（コードがまだ使われている場合など）
    }; // 追加: 部屋作りここまで

  }else{ // 追加: ゲストは部屋に入り直す
    let tries=0; // 追加: 試した回数

      try{if(peer){try{peer.destroy();}catch(e){}}peer=new Peer(undefined,NET_PEER_CFG2800);}catch(e){setTimeout(tryJoin,2000);return;} // 追加: 自分のPeerを作る（前のPeerは壊してから・STUN複数指定）
      peer.on('open',id=>{ // 追加: 自分の準備ができたら
        conn=peer.connect('kt-room-'+SET.roomCode); // 追加: ホストに接続する
        conn.on('open',()=>{netSetStatus('ステータス: ホストへ接続成功！開始します…');setTimeout(()=>{startGame();},1200);}); // 追加: 接続成功
        conn.on('data',d=>applyNetData(d)); // 追加: 相手のデータを受け取る
        conn.on('error',()=>{setTimeout(tryJoin,2000);}); // 追加: 失敗したら2秒後にもう一度
      }); // 追加: 参加準備ここまで
      peer.on('error',()=>{setTimeout(tryJoin,2000);}); // 追加: エラーでも2秒後にもう一度
    }; // 追加: 参加ここまで
    tryJoin(); // 追加: 参加を始める
  } // 追加: 自動復帰ここまで
} // 追加: 自動復帰ここまで
document.addEventListener('click',e=>{ // 追加: オンライン切替パネルのボタン

function missionGrant(rw){ // 追加: ミッションの報酬を渡す
  const got=[]; // 追加: 渡したものの表示
  if(!rw)return ''; // 追加: 報酬がなければ終わり
  if(rw.money){SET.money[0]+=rw.money;got.push('¥'+rw.money.toLocaleString());} // 追加: お金の報酬
  if(rw.part){const pa=PARTS2.find(x=>x.id===rw.part);const pt=SET.parts[0];if(pa&&pt){pt[rw.part]=Math.min(3,(pt[rw.part]||0)+1);got.push((pa.n||rw.part)+' Lv'+pt[rw.part]+'（今の車）');}} // 追加: パーツの報酬（今の車に+1Lv）
  if(rw.car!==undefined){if(!mOwn(rw.car)){SET.ownedCars[0].push(rw.car);got.push(CARS[rw.car].n);}else{SET.money[0]+=1000000;got.push('¥1,000,000（車は持っていたので代わりに）');}} // 追加: 車の報酬
  if(rw.decal){if(!(SET.decals||[]).includes(rw.decal)){SET.decals=SET.decals||[];SET.decals.push(rw.decal);}const dd=DECALS.find(x=>x.id===rw.decal);got.push(dd?dd.n:rw.decal);} // 追加: デカールの報酬
  if(rw.logo){if(!SET.bonusLogos.includes(rw.logo)){SET.bonusLogos.push(rw.logo);if(!COMPANY_LOGOS.includes(rw.logo))COMPANY_LOGOS.push(rw.logo);}got.push('会社の新ロゴ '+rw.logo);} // 追加: ロゴの報酬
  return got.join(' ＋ '); // 追加: 報酬の文を返す
} // 追加: 報酬ここまで
function missionRewardText(rw){ // 追加: 報酬の表示文を作る
  if(!rw)return 'なし';const t=[]; // 追加: 表示用
  if(rw.money)t.push('¥'+rw.money.toLocaleString()); // 追加: お金
  if(rw.part){const pa=PARTS2.find(x=>x.id===rw.part);t.push('パーツ「'+(pa?pa.n:rw.part)+'」+1Lv（今の車）');} // 追加: パーツ
  if(rw.car!==undefined)t.push('車「'+CARS[rw.car].n+'」'); // 追加: 車
  if(rw.decal){const dd=DECALS.find(x=>x.id===rw.decal);t.push('デカール「'+(dd?dd.n:rw.decal)+'」');} // 追加: デカール
  if(rw.logo)t.push('会社の新ロゴ '+rw.logo); // 追加: ロゴ
  return t.join(' ＋ '); // 追加: 表示文ここまで
} // 追加: 報酬表示ここまで

function raceGridFix(){ // 追加: レースのグリッドを自分の車と互角の車でそろえる
  if(regRaceRange)return; // 追加: レギュレーション戦はそのまま
  if(SET.mode!=='race'&&SET.mode!=='split_race')return; // 追加: レース系のモードだけ
  const pci=(SET.cfg&&SET.cfg[0]&&SET.cfg[0].car)||0; // 追加: 自分の車の番号
  let pov=ovrOf(CARS[pci]||CARS[0]); // 追加: 自分の車のOVR
  try{const tv=tunedOvr(0,pci);if(tv)pov=tv;}catch(e){} // 追加: チューニング込みのOVRがあればそちら
  let pool=CARS.map((c,i)=>i).filter(i=>{const o=ovrOf(CARS[i]);return o>=pov-12&&o<=pov+8;}); // 追加: 互角の車の候補
  if(pool.length<6)pool=CARS.map((c,i)=>i).filter(i=>{const o=ovrOf(CARS[i]);return o>=pov-22&&o<=pov+14;}); // 追加: 少なければ範囲を広げる
  if(pool.length<6)pool=CARS.map((c,i)=>i).filter(i=>{const o=ovrOf(CARS[i]);return o>=pov-35&&o<=pov+25;}); // 追加: もっと広げる
  if(pool.length===0)return; // 追加: 候補がなければそのまま
  for(let i2=pool.length-1;i2>0;i2--){const j2=Math.floor(Math.random()*(i2+1));const tmp=pool[i2];pool[i2]=pool[j2];pool[j2]=tmp;} // 追加: 候補を混ぜて車種の偏りをなくす
  let pi=0; // 追加: 割り当て位置
  TR.forEach(t=>{ // 追加: 出ているAI車を互角の車に替える
    if(!t.on)return; // 追加: 出ていない車はそのまま
    const ci=pool[pi%pool.length];pi++; // 追加: 候補から順に選ぶ
    if(t.aiCar!==ci)swapNpcCar(t,ci); // 追加: 車を替える
  }); // 追加: 割り当てここまで
} // 追加: レースグリッド調整ここまで

function pickPedTarget(pd){ // 追加: 通行人の次の行き先を決める
  if(pd.area){pd.tx=pd.cx+(Math.random()*2-1)*pd.range;pd.tz=pd.cz+(Math.random()*2-1)*pd.range;} // 追加: 広場の人はエリア内を自由に歩く
  else{const o=(Math.random()*2-1)*pd.range;const lat=(Math.random()*2-1)*1.3;pd.tx=pd.cx+pd.ax*o-pd.az*lat;pd.tz=pd.cz+pd.az*o+pd.ax*lat;} // 追加: 街路の人は歩道沿いに、少し横にずれて
} // 追加: 行き先ここまで
const MEET={cars:[],timer:12}; // 追加: AI集会の状態
function meetReleaseCar(t){ // 追加: 集会の車を通常に戻す
  if(t.meet&&t.meet.spot)t.meet.spot.taken=null; // 追加: マスを空ける
  delete t.meet; // 追加: 集会の印を消す
} // 追加: 解除ここまで
function meetReleaseAll(){ // 追加: 集会を全部やめる
  MEET.cars.forEach(t=>meetReleaseCar(t));MEET.cars=[]; // 追加: 全車解除
} // 追加: 全解除ここまで
function pinMeetCar(t){ // 追加: 集会の車を止めた位置に固定する
  t.curSpd=0; // 追加: 止める
  t.g.position.set(t.x,groundYAt(t.x,t.z),t.z);t.g.rotation.y=t.h; // 追加: 見た目を合わせる
} // 追加: 固定ここまで
function driveMeetCar(t,wp,dt){ // 追加: 集会の車を目標へ走らせる
  const dx=wp.x-t.x,dz=wp.z-t.z;const dist=Math.hypot(dx,dz); // 追加: 目標までの距離
  const want=Math.atan2(dx,dz);const dh=wrap(want-t.h); // 追加: 向きの差
  t.h=wrap(t.h+clamp(dh,-2.4*dt,2.4*dt)); // 追加: ハンドルを切る
  const spd=dist<10?3.2:7.5; // 追加: 近づいたらゆっくり
  t.x+=Math.sin(t.h)*spd*dt;t.z+=Math.cos(t.h)*spd*dt; // 追加: 進む
  t.curSpd=spd; // 追加: 交通処理と喧嘩しないよう速さを伝える
  t.g.position.set(t.x,groundYAt(t.x,t.z),t.z);t.g.rotation.y=t.h; // 追加: 見た目を合わせる
} // 追加: 集会の運転ここまで
function meetPathFor(t){ // 追加: 駐車場までの道順を作る
  let ramp=null,bd=1e18; // 追加: 一番近い入口の坂
  cityRamps.forEach(r=>{if(r.y0<=CITY_Y+0.05)return;const d=Math.hypot(t.x-r.x0,t.z-r.z0);if(d<bd){bd=d;ramp=r;}}); // 追加: 坂を探す
  if(!ramp||bd>170)return null; // 追加: 遠すぎたら今回はやめる
  const foot={x:ramp.x0+ramp.dx*ramp.len,z:ramp.z0+ramp.dz*ramp.len}; // 追加: 坂の下
  let street=null; // 追加: 街路の入口
  if(cityData&&cityData.ramps)cityData.ramps.forEach(sg=>{if(Math.hypot(sg.x1-foot.x,sg.z1-foot.z)<3)street={x:sg.x2,z:sg.z2};}); // 追加: つなぎ道路の先が街路
  const cx=cityData.cx,cz=cityData.cz; // 追加: 街の中心
  if(!street){ // 追加: つなぎがなければ一番近い街路の点を使う
    let bs=1e18; // 追加: 最寄りの距離
    [-220,-110,0,110,220].forEach(dx=>{const px2=cx+dx;const pz2=Math.max(cz-290,Math.min(cz+290,foot.z));const d=Math.hypot(foot.x-px2,foot.z-pz2);if(d<bs){bs=d;street={x:px2,z:pz2};}}); // 追加: 南北の街路
    [-110,0,110].forEach(dz=>{const pz2=cz+dz;const px2=Math.max(cx-290,Math.min(cx+290,foot.x));const d=Math.hypot(foot.x-px2,foot.z-pz2);if(d<bs){bs=d;street={x:px2,z:pz2};}}); // 追加: 東西の街路
  } // 追加: 街路探しここまで
  const X=cx-110,Z=cz; // 追加: 駐車場に一番近い交差点の通り
  const entry={x:MEET_LOT.x+MEET_LOT.hw+3,z:Z}; // 追加: 駐車場の入口
  const spot=MEET_SPOTS.find(s2=>!s2.taken); // 追加: 空いている集会マス
  if(!spot)return null; // 追加: 空きがなければやめる
  const wp=[{x:ramp.x0,z:ramp.z0},foot]; // 追加: まず坂を下る
  const onNS=[-220,-110,0,110,220].some(dx=>Math.abs(street.x-(cx+dx))<3); // 追加: 南北の街路にいるか
  if(onNS){if(Math.abs(street.z-Z)>2)wp.push({x:street.x,z:Z});} // 追加: 南北の街路を進んで入口の高さへ
  else{if(Math.abs(street.x-X)>2)wp.push({x:X,z:street.z});if(Math.abs(street.z-Z)>2)wp.push({x:X,z:Z});} // 追加: 東西の街路→南北の街路→入口の高さへ
  wp.push(street); // 追加: 街路に出る
  wp.push(entry); // 追加: 入口へ
  wp.push({x:spot.x,z:Z}); // 追加: 駐車場の中を進む
  wp.push({x:spot.x,z:spot.z}); // 追加: マスへ
  spot.taken=t; // 追加: マスを取る
  return {wp:wp,spot:spot}; // 追加: 道順とマスを返す
} // 追加: 道順ここまで
function meetStep(dt){ // 追加: AI車がトラングラの駐車場に集まる
  try{ // 追加: 安全に進める
    if(SET.route!==7||SET.mode!=='free'||!MEET_LOT){if(MEET.cars.length)meetReleaseAll();return;} // 追加: 条件が違うときは集会しない
    const frozen=(cd>0||raceFinishedAll); // 追加: カウントダウン中は動かさない
    if(!frozen){ // 追加: 新しい参加者
      MEET.timer-=dt; // 追加: 次の参加までの時間
      if(MEET.cars.length<3&&MEET.timer<=0){ // 追加: 最大3台まで
        MEET.timer=40+Math.random()*30; // 追加: 次は40〜70秒後
        const cands=TR.filter(t=>t.on&&!t.meet&&t.g); // 追加: 参加できる車の候補
        for(let ci2=0;ci2<cands.length;ci2++){const pth=meetPathFor(cands[ci2]);if(pth){cands[ci2].meet={wp:pth.wp,rpath:pth.wp.slice().reverse(),i:0,state:'go',t:0,spot:pth.spot};MEET.cars.push(cands[ci2]);break;}} // 追加: 入口に近い車から参加させる
      } // 追加: 参加ここまで
    } // 追加: 参加処理ここまで
    for(let ci=MEET.cars.length-1;ci>=0;ci--){ // 追加: 集まっている車を進める
      const t=MEET.cars[ci]; // 追加: 車
      if(!t.on||!t.meet){if(t.meet)meetReleaseCar(t);MEET.cars.splice(ci,1);continue;} // 追加: 消えた車は外す
      const mt=t.meet; // 追加: 集会の状態
      if(mt.state==='parked'){ // 追加: 止まっている車
        pinMeetCar(t); // 追加: 位置を固定
        if(!frozen){mt.t+=dt;if(mt.t>(mt.stay||70)){mt.state='back';mt.wp=mt.rpath;mt.i=0;}} // 追加: 長く止まったら帰る
        continue; // 追加: 次の車へ
      } // 追加: 駐車ここまで
      if(frozen)continue; // 追加: カウントダウン中は走らせない
      const wp=mt.wp[mt.i]; // 追加: 今の目標
      if(!wp){ // 追加: 道順の最後に着いた
        if(mt.state==='go'){mt.state='parked';mt.t=0;mt.stay=50+Math.random()*60;t.x=mt.spot.x;t.z=mt.spot.z;t.h=mt.spot.rot;pinMeetCar(t);} // 追加: マスにきちんと止める
        else{meetReleaseCar(t);t.curSpd=12;MEET.cars.splice(ci,1);} // 追加: 帰り切ったら通常の交通に戻す
        continue; // 追加: 次の車へ
      } // 追加: 到着ここまで
      driveMeetCar(t,wp,dt); // 追加: 目標へ走る
      if(Math.hypot(wp.x-t.x,wp.z-t.z)<2.2)mt.i++; // 追加: 近づいたら次の目標へ
    } // 追加: 車ごとここまで
  }catch(e){} // 追加: 失敗しても止めない
} // 追加: AI集会ここまで
function meetLabelStep(){ // 追加: 駐車場の中に入ったら車名が見える
  try{ // 追加: 安全に
    if(!MEET_LOT||!meetLabels.length)return; // 追加: 駐車場がなければ何もしない
    let px2,pz2; // 追加: プレイヤーの位置
    if(onFoot&&walkChar&&walkChar.g){px2=walkChar.g.position.x;pz2=walkChar.g.position.z;} // 追加: 歩いているとき
    else if(players&&players[0]){px2=players[0].S.x;pz2=players[0].S.z;} // 追加: 車のとき
    else return; // 追加: 位置が分からなければ何もしない
    const inside=Math.abs(px2-MEET_LOT.x)<MEET_LOT.hw+7&&Math.abs(pz2-MEET_LOT.z)<MEET_LOT.hd+7; // 追加: 駐車場の中にいるか
    meetLabels.forEach(Lb=>{Lb.sp.visible=inside&&Math.hypot(px2-Lb.x,pz2-Lb.z)<52;}); // 追加: 中にいて近い車だけ名前を出す
  }catch(e){} // 追加: 失敗しても止めない
} // 追加: 車名表示ここまで
const _trafficStepV2716=trafficStep; // 追加: 元の交通処理を覚える
trafficStep=function(dt){ // 追加: 集会の車は通常の交通から外して進める
  const held=[]; // 追加: 集会中の車を控える
  TR.forEach(t=>{if(t.meet&&t.on){t.on=false;held.push(t);}}); // 追加: 集会の車を交通から外す（進路が喧嘩しないように）
  _trafficStepV2716(dt); // 追加: 通常の交通
  held.forEach(t=>{t.on=true;}); // 追加: 戻す
  meetStep(dt);meetLabelStep(); // 追加: 集会と車名表示を進める
}; // 追加: 交通ラッパーここまで

  let pdTarget = null, pdX = 0, pdY = 0; // 追加: タップ開始の対象と位置（スクロールと区別するため）
  const findTap = function(t){ // 追加: タップできるものを探す（ボタン以外も含む）
    if(!t||!t.closest)return null;
    return t.closest('button,[data-a],[data-garage-car],[data-shop-opt],[data-switch-car],[data-garage-tab],[data-garage-theme],[data-repair],[data-timebet],[data-photo-del]'); // 追加: ボタンと押せる項目
  }; // 追加: タップ対象ここまで
  document.addEventListener('pointerdown', function(e){ // 追加: タッチ開始の位置だけ覚える
    if(e.pointerType && e.pointerType!=='touch') return; // 追加: マウスは今まで通りclickで動く
    const b = findTap(e.target); // 追加: 押したものを探す
    if(!b) return; // 追加: 押せるものでなければ何もしない
    pdTarget = b; pdX = e.clientX; pdY = e.clientY; // 追加: 対象と位置を覚える（clickはまだ出さない）
  }); // 追加: pointerdownの処理ここまで
  document.addEventListener('pointerup', function(e){ // 追加: 指を離したときにタップかスクロールか決める
    if(!pdTarget) return; // 追加: 対象がなければ何もしない
    const oldB = pdTarget; pdTarget = null; // 追加: 対象を取り出す
    if(Math.abs(e.clientX - pdX) < 12 && Math.abs(e.clientY - pdY) < 12){ // 追加: 指があまり動いていなければタップ
      e.preventDefault(); // 追加: あとから来る本物のclickを止めて二重押しを防ぐ
      lastTapAt = Date.now(); // 追加: タップした時刻を覚える
      let b = null; // 追加: 今押すボタン
      try{ const el = document.elementFromPoint(e.clientX, e.clientY); b = findTap(el); }catch(err){} // 追加: 指の下にある今のボタンを探し直す（メニューが描き直されて古いボタンが消えていても動く）
      if(!b && oldB && oldB.isConnected) b = oldB; // 追加: 見つからなければ押したときのボタン（まだ画面にあれば）
      if(b) b.click(); // 追加: 今までのclick処理をそのまま呼ぶ
    } // 追加: スクロールならclickを出さない（誤タップ防止）
  }); // 追加: pointerupの処理ここまで
  document.addEventListener('pointercancel', function(){ pdTarget = null; }); // 追加: タッチ中断は対象を消す
  document.addEventListener('click', function(e){ // 追加: タップ直後の本物のclickを止める
    if(!e.isTrusted) return; // 追加: こっちで出したclickは通す
    if(Date.now() - lastTapAt < 400){ // 追加: タップから400ms以内の本物のclickはゴースト
      e.stopPropagation(); // 追加: ボタンの処理に届かせない
      e.preventDefault(); // 追加: 二重押しとショップの誤購入を防ぐ
    } // 追加: ゴースト判定ここまで
  }, true); // 追加: キャプチャ段階で先に止める
  if(!('PointerEvent' in window)){ // 追加: Pointer Eventsがない古いiPhone用
    document.querySelectorAll('.tb').forEach(function(b){ // 追加: ハンドル・アクセルボタン
      const k=b.dataset.k; if(!k) return; // 追加: キーなしは別で扱う
      const on=function(e){e.preventDefault();K[k]=true;b.classList.add('on');}; // 追加: 押す
      const off=function(e){e.preventDefault();K[k]=false;b.classList.remove('on');}; // 追加: 離す
      b.addEventListener('touchstart',on,{passive:false}); // 追加: タッチ開始
      b.addEventListener('touchend',off,{passive:false}); // 追加: タッチ終了
      b.addEventListener('touchcancel',off,{passive:false}); // 追加: タッチ中断
    }); // 追加: ハンドル・アクセルここまで
    [shopBtnTouch, walkBtnTouch, document.getElementById('menuBtn'), document.getElementById('shopBtn2')].forEach(function(b){ // 追加: 店・降りる・メニュー・2P店ボタン
      if(!b) return; // 追加: なければ飛ばす
      b.addEventListener('touchstart', function(e){e.preventDefault();b.dispatchEvent(new Event('pointerdown'));}, {passive:false}); // 追加: touchstartをpointerdownに変える
    }); // 追加: 古いiPhone用ここまで
  } // 追加: Pointer Eventsなしの分岐ここまで
})(); // 追加: タップ対策ここまで

function buildingTexture3100(col,seed,cols,rows){ // 追加: 窓の並び方を変えられるビルの絵を作る
  const cv=document.createElement('canvas');cv.width=128;cv.height=256; // 追加: 絵の大きさ
  const c2=cv.getContext('2d');c2.fillStyle='#'+col.toString(16).padStart(6,'0');c2.fillRect(0,0,128,256); // 追加: 壁の色
  const rnd2=(a)=>{const x=Math.sin(seed*127.1+a*311.7)*43758.5453;return x-Math.floor(x);}; // 追加: 決まった乱数
  for(let r=0;r<rows;r++)for(let c3=0;c3<cols;c3++){ // 追加: 窓を並べる
    const lit=rnd2(r*cols+c3)>0.5; // 追加: 明かりが付いている窓
    c2.fillStyle=lit?'#fde68a':'#22303f'; // 追加: 明るい窓と暗い窓
    const ww=Math.floor(108/cols),wh=Math.floor(232/rows); // 追加: 窓の大きさ
    c2.fillRect(10+c3*(ww+4),12+r*(wh+4),ww,Math.max(6,wh-4)); // 追加: 窓を描く
  } // 追加: 窓ここまで
  return new THREE.CanvasTexture(cv); // 追加: 絵を返す
} // 追加: ビルの絵ここまで
function signTexture3100(text,bg,fg){ // 追加: 看板の絵を作る
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;const c2=cv.getContext('2d'); // 追加: 看板の絵
  c2.fillStyle=bg;c2.fillRect(0,0,256,64);c2.strokeStyle=fg;c2.lineWidth=4;c2.strokeRect(3,3,250,58); // 追加: 看板の色と枠
  c2.fillStyle=fg;c2.font='bold 30px sans-serif';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(text,128,34); // 追加: 看板の文字
  return new THREE.CanvasTexture(cv); // 追加: 絵を返す
} // 追加: 看板の絵ここまで
function variedBuilding3100(g,x,z,w,d,h,kind,seed){ // 追加: いろんな種類の建物を1つ作る
  const hash=(a)=>{const v=Math.sin(seed*91.7+a*57.3)*43758.5453;return v-Math.floor(v);}; // 追加: 決まった乱数
  const conf={ // 追加: 種類ごとの壁の色と窓の並び
    glass:{col:0x2e4a5e,cols:6,rows:14},brick:{col:0x8a4b38,cols:3,rows:8},mansion:{col:0xd8cfb8,cols:4,rows:9},
    office:{col:0xb9c0c7,cols:7,rows:12},hotel:{col:0xcfc0a0,cols:5,rows:11},conveni:{col:0xf1f5f9,cols:6,rows:2},house:{col:0xe8dcc4,cols:2,rows:2}
  }[kind]||{col:0x9aa5b1,cols:4,rows:10}; // 追加: 種類の設定
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({map:buildingTexture3100(conf.col,seed,conf.cols,conf.rows)}));m.position.set(x,0.16+h/2,z);g.add(m); // 追加: 建物本体
  if(kind==='house'){ // 追加: 家は三角屋根
    const roof=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*0.78,2.6,4),LM(0x7c4a21));roof.position.set(x,0.16+h+1.3,z);roof.rotation.y=Math.PI/4;roof.scale.set(1,1,d/w);g.add(roof); // 追加: 屋根
  }else if(kind==='glass'){ // 追加: ガラスビルは一段引っ込んだ上層階
    const top=new THREE.Mesh(new THREE.BoxGeometry(w*0.7,3.4,d*0.7),new THREE.MeshLambertMaterial({map:buildingTexture3100(conf.col,seed+5,5,2)}));top.position.set(x,0.16+h+1.7,z);g.add(top); // 追加: 上層階
    const cap=new THREE.Mesh(new THREE.BoxGeometry(w+0.6,0.5,d+0.6),LM(0x1f2937));cap.position.set(x,0.16+h+0.25,z);g.add(cap); // 追加: 屋上のふち
  }else if(kind==='conveni'){ // 追加: コンビニは帯と看板とガラス面
    const band=new THREE.Mesh(new THREE.BoxGeometry(w+0.3,1.1,d+0.3),LM(0x059669));band.position.set(x,0.16+h-1.2,z);g.add(band); // 追加: 緑の帯
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(w*0.7,1.4),new THREE.MeshBasicMaterial({map:signTexture3100('コンビニ','#059669','#ffffff'),side:THREE.DoubleSide}));sign.position.set(x,0.16+h-1.2,z+d/2+0.25);g.add(sign); // 追加: 看板
    const glassF=new THREE.Mesh(new THREE.PlaneGeometry(w*0.85,2.2),LM(0x9fd8ef));glassF.position.set(x,0.16+1.3,z+d/2+0.06);g.add(glassF); // 追加: ガラス面
  }else{ // 追加: そのほかの建物の屋上まわり
    const cap=new THREE.Mesh(new THREE.BoxGeometry(w+0.6,0.5,d+0.6),LM(0x1f2937));cap.position.set(x,0.16+h+0.25,z);g.add(cap); // 追加: 屋上のふち
    if(hash(1)>0.45){const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.6,10),LM(0x9ca3af));tank.position.set(x-w/4,0.16+h+1.8,z-d/4);g.add(tank);const tc=new THREE.Mesh(new THREE.ConeGeometry(1.8,1.0,10),LM(0x6b7280));tc.position.set(x-w/4,0.16+h+3.6,z-d/4);g.add(tc);} // 追加: 屋上の水タンク
    if(hash(2)>0.55){const panel=new THREE.Mesh(new THREE.BoxGeometry(4.4,0.15,3),LM(0x1e3a5f));panel.position.set(x+w/5,0.16+h+1.0,z+d/5);panel.rotation.x=-0.4;g.add(panel);} // 追加: ソーラーパネル
    if(kind==='hotel'){const sign=new THREE.Mesh(new THREE.PlaneGeometry(9,1.9),new THREE.MeshBasicMaterial({map:signTexture3100('🏨 HOTEL','#7c3aed','#ffffff'),side:THREE.DoubleSide}));sign.position.set(x,0.16+h+2.2,z);g.add(sign);const pole=new THREE.Mesh(new THREE.BoxGeometry(0.3,2.2,0.3),LM(0x374151));pole.position.set(x,0.16+h+0.9,z);g.add(pole);} // 追加: ホテルの屋上看板
    if(kind==='office'&&hash(3)>0.4){const ad=['DRINK!','☕ CAFE','🚗 AUTO','SALE','📱 MOBILE'][Math.floor(hash(4)*5)];const bd=new THREE.Mesh(new THREE.PlaneGeometry(7.5,2.6),new THREE.MeshBasicMaterial({map:signTexture3100(ad,'#dc2626','#ffffff'),side:THREE.DoubleSide}));bd.position.set(x,0.16+h+1.6,z);g.add(bd);const bp=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.8,0.3),LM(0x374151));bp.position.set(x,0.16+h+0.4,z);g.add(bp);} // 追加: オフィスビルの屋上広告
    if(kind==='mansion'){const floors=Math.max(2,Math.floor(h/3));for(let f=1;f<floors;f++){for(let bx2=-1;bx2<=1;bx2++){const bal=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.18,0.9),LM(0x9ca3af));bal.position.set(x+bx2*(w/3.2),0.16+f*3,z+d/2+0.45);g.add(bal);const rail=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.06),LM(0x6b7280));rail.position.set(x+bx2*(w/3.2),0.16+f*3+0.3,z+d/2+0.88);g.add(rail);}}} // 追加: マンションのベランダ
    if(kind==='brick'){const shop=new THREE.Mesh(new THREE.BoxGeometry(w*0.9,2.6,0.4),LM(0x78350f));shop.position.set(x,0.16+1.3,z+d/2+0.15);g.add(shop);const awn=new THREE.Mesh(new THREE.BoxGeometry(w*0.95,0.18,1.6),LM(0xb45309));awn.position.set(x,0.16+2.9,z+d/2+0.8);awn.rotation.x=0.25;g.add(awn);} // 追加: レンガビルの1階店舗とひさし
  } // 追加: 屋上まわりここまで
  return m; // 追加: 建物を返す
} // 追加: 建物作りここまで
function cityVariety3100(){ // 追加: 街並みにバリエーションを足す
  if(RT.ctype!=='megacity')return; // 追加: 街マップだけ
  const cityG=scene.children.find(o=>o.name==='city');if(!cityG)return; // 追加: 街のグループを探す
  const hash=(a,b)=>{const v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v);}; // 追加: 決まった乱数
  // 既存ビルの壁の色と窓の並びをバラバラにする（高いタワーはランドマークなのでそのまま）
  const palette=[0x8a5a44,0xd6c9a8,0x7fb2d9,0x9db89a,0xc7ccd4,0xe0b49c,0x5b7a99,0xb8a888,0xa26769,0x6b8f71]; // 追加: 壁の色の候補
  cityG.traverse(o=>{ // 追加: 街の全部品を見る
    if(o.isMesh&&o.material&&o.material.map&&o.geometry&&o.geometry.type==='BoxGeometry'){ // 追加: ビル本体だけ
      const gp=o.geometry.parameters;if(!gp||gp.height<5||gp.height>=55)return; // 追加: 小物とタワーは除く
      const col=palette[Math.floor(hash(o.position.x,o.position.z)*palette.length)]; // 追加: 場所ごとに色を決める
      const cols=Math.max(3,Math.min(8,Math.round(gp.width/5))),rows=Math.max(4,Math.min(18,Math.round(gp.height/3.2))); // 追加: 大きさに合った窓の数
      o.material.map=buildingTexture3100(col,Math.floor(Math.abs(o.position.x)+Math.abs(o.position.z)),cols,rows); // 追加: 新しい壁の絵に変える
    } // 追加: ビル判定ここまで
  }); // 追加: 既存ビルの色替えここまで
  // 区画の空いている角に、いろんな種類の建物を足す
  const cx=cityData.cx,cz=cityData.cz; // 追加: 街の中心
  const towerBlocks={'1,0':1,'2,1':1,'2,0':1}; // 追加: タワーの区画
  const kindsInner=['glass','office','hotel','brick','mansion']; // 追加: 中心寄りの建物
  const kindsOuter=['mansion','brick','house','conveni','office']; // 追加: 外寄りの建物
  for(let bi=0;bi<4;bi++)for(let bj=0;bj<2;bj++){ // 追加: 区画ごとに
    if(bi===0&&bj===0)continue; // 追加: 公園はそのまま
    if(bi===0&&bj===1&&SET.route===7)continue; // 追加: トラングラの駐車場はそのまま
    const bx=cx+(bi-1.5)*110,bz=cz+(bj-0.5)*110; // 追加: 区画の中心
    const corners=towerBlocks[bi+','+bj]?[[22,25],[-22,25]]:[[22,-25],[-22,25]]; // 追加: 空いている角（タワー区画はタワーを避ける）
    corners.forEach((cn,ci)=>{ // 追加: 角ごとに建てる
      const seed=bi*31+bj*17+ci*7+3;const outer=(bi===0||bi===3); // 追加: 場所の情報
      const kind=(outer?kindsOuter:kindsInner)[Math.floor(hash(seed,ci)*5)]; // 追加: 種類を決める
      let w,d,h; // 追加: 大きさ
      if(kind==='house'){w=12+hash(seed,1)*4;d=11+hash(seed,2)*4;h=5.5+hash(seed,3)*2;} // 追加: 家の大きさ
      else if(kind==='conveni'){w=24+hash(seed,1)*6;d=15+hash(seed,2)*4;h=6;} // 追加: コンビニの大きさ
      else if(kind==='glass'){w=22+hash(seed,1)*8;d=22+hash(seed,2)*8;h=26+hash(seed,3)*16;} // 追加: ガラスビルの大きさ
      else if(kind==='hotel'){w=24+hash(seed,1)*6;d=22+hash(seed,2)*6;h=20+hash(seed,3)*10;} // 追加: ホテルの大きさ
      else{w=20+hash(seed,1)*9;d=20+hash(seed,2)*9;h=11+hash(seed,3)*19;} // 追加: そのほかの大きさ
      variedBuilding3100(cityG,bx+cn[0],bz+cn[1],w,d,h,kind,seed); // 追加: 建てる
      cityData.buildings.push({x:bx+cn[0],z:bz+cn[1],w:w,d:d}); // 追加: 当たり判定とミニマップ用
    }); // 追加: 角ここまで
  } // 追加: 区画ここまで
  // 街路樹を歩道沿いに植える
  const NS=[-220,-110,0,110,220],EW=[-110,0,110];let treeN=0; // 追加: 街路の位置と本数
  const plantTree=(x,z,s)=>{ // 追加: 木を1本植える
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.6,2.6,6),LM(0x7c4a21));tr.position.set(x,0.16+1.3,z);cityG.add(tr); // 追加: 幹
    if(s>0.5){const lv=new THREE.Mesh(new THREE.ConeGeometry(2.6,6,8),LM(0x166534));lv.position.set(x,0.16+5.4,z);cityG.add(lv);} // 追加: とがった葉
    else{const lv=new THREE.Mesh(new THREE.IcosahedronGeometry(2.7,0),LM(0x15803d));lv.position.set(x,0.16+5.2,z);cityG.add(lv);} // 追加: 丸い葉
  }; // 追加: 木ここまで
  NS.forEach(dx=>{for(let t=-259;t<=259;t+=37){if(EW.some(dz=>Math.abs(t-dz)<17))continue;if(hash(dx,t)<0.3)continue;if(treeN>=46)return;plantTree(cx+dx+(t%74===0?6.5:-6.5),cz+t,hash(t,dx));treeN++;}}); // 追加: 南北の街路樹
  EW.forEach(dz=>{if(dz===0)return;for(let t=-259;t<=259;t+=41){if(NS.some(dx=>Math.abs(t-dx)<17))continue;if(hash(t,dz)<0.35)continue;if(treeN>=64)return;plantTree(cx+t,cz+dz+(t%82===0?6.5:-6.5),hash(dz,t));treeN++;}}); // 追加: 東西の街路樹（高速の下の通りは除く）
} // 追加: 街並みバリエーションここまで
try{cityVariety3100();}catch(e){} // 追加: 街並みを増やす
